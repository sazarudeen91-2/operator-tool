-content:flex-start; padding-left:4px; font-size:14px; }\n    .check-checkbox-wrap input[type=\"checkbox\"]{ width:20px; height:20px; }\n    textarea.remark-input{ font-size:16px; }\n    .checklist-row{ flex-direction:column; align-items:stretch; }\n    .check-chip{ justify-content:flex-start; }\n    .checklist-edit-row{ flex-wrap:wrap; }\n    input.check-label{ min-width:120px; }\n    .checklist-edit-row .notimer-row input[type=\"checkbox\"]{ width:18px; height:18px; }\n    .notimer-row input[type=\"checkbox\"]{ width:18px; height:18px; }\n    .step{ margin-bottom:12px; }\n    body{ padding-bottom:calc(60px + env(safe-area-inset-bottom, 0px)); }\n    .step-row1{ display:flex; flex-direction:column; align-items:stretch; gap:8px; }\n    input.step-name{ min-width:0; width:100%; order:1; font-size:16px; }\n    .dur-wrap{ order:2; align-self:flex-start; }\n    select.step-status{ order:3; align-self:flex-start; }\n    .notimer-row{ order:4; }\n    .reorder-btns{ flex-direction:row; order:5; align-self:flex-start; }\n    .reorder-btns button{ min-height:34px; min-width:34px; }\n    .rm-step{ order:6; align-self:flex-end; }\n    .operator-row{ flex-wrap:wrap; }\n    .operator-row input.operator-name{ min-width:140px; }\n    .signoff #reportBtn{ width:100%; }\n    .remark-wrap textarea.remark-input{ min-height:36px; }\n  }\n  @media (max-width: 400px){\n    .wrap{ padding:8px 6px; }\n    .step{ padding:8px 6px; gap:6px; }\n    .badge{ width:22px; height:22px; font-size:10.5px; }\n    input.unit-name{ font-size:18px; }\n    .timer{ font-size:19px; min-width:50px; }\n    .icon-btn{ width:40px; min-height:40px; }\n  }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n  <h2 class=\"sr-only\">Interactive operator checklist for a centrifuge unit start-up SOP, with ten editable steps, per-step countdown timers, and shift progress tracking that saves automatically.</h2>\n\n  <header>\n    <div class=\"htitle\">\n      <p class=\"eyebrow\" id=\"eyebrowLabel\">CENTRIFUGE UNIT \u2014 OPERATOR SOP</p>\n      <input class=\"unit-name\" id=\"unitName\" value=\"Centrifuge Unit\" spellcheck=\"false\">\n    </div>\n  </header>\n\n\n  <div id=\"completeBanner\" class=\"report-banner\" style=\"display:none;\"></div>\n\n  <div class=\"progress-label\">\n    <span id=\"progressText\">0 of 10 steps complete</span>\n    <span class=\"save-note\" id=\"saveNote\">saved</span>\n  </div>\n  <div class=\"progressbar\"><div id=\"progressFill\" style=\"width:0%\"></div></div>\n\n  <div id=\"stepList\"></div>\n  <button class=\"add-step\" id=\"addStep\"></button>\n\n  <div class=\"signoff\">\n    <p class=\"signoff-title\" id=\"signoffTitle\">Sign-off</p>\n    <div class=\"operator-row\">\n      <label for=\"operatorName\">Operator:<span class=\"required-mark\">*</span></label>\n      <input class=\"operator-name\" id=\"operatorName\" placeholder=\"Enter operator name (required)\" spellcheck=\"false\">\n    </div>\n    <div class=\"field-error\" id=\"operatorError\" style=\"display:none;\">Operator name is required before marking steps or generating a report.</div>\n    <button class=\"small green-btn\" id=\"reportBtn\" title=\"Generate PDF report\"></button>\n  </div>\n\n  <footer>Progress is saved automatically on this device/browser.</footer>\n</div>\n\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js\"><\/script>\n<script>\nconst ICONS = {\n  play: '<svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M7 5.5v13a1 1 0 0 0 1.5.87l11-6.5a1 1 0 0 0 0-1.74l-11-6.5A1 1 0 0 0 7 5.5Z\" fill=\"currentColor\"/></svg>',\n  pause: '<svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"6\" y=\"5\" width=\"4.5\" height=\"14\" rx=\"1\" fill=\"currentColor\"/><rect x=\"13.5\" y=\"5\" width=\"4.5\" height=\"14\" rx=\"1\" fill=\"currentColor\"/></svg>',\n  reset: '<svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M4 12a8 8 0 1 1 2.6 5.9\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M4 17v-5h5\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"/></svg>',\n  check: '<svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M4.5 12.5 9.5 17.5 19.5 6.5\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"/></svg>',\n  cross: '<svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M6 6l12 12M18 6 6 18\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"/></svg>',\n  crossSm: '<svg class=\"icon-sm\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M6 6l12 12M18 6 6 18\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"/></svg>',\n  trash: '<svg class=\"icon-sm\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M5 7h14M9.5 7V5a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v2M7 7l1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"/></svg>',\n  edit: '<svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\" fill=\"none\"/></svg>',\n  plus: '<svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M12 5v14M5 12h14\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/></svg>',\n  report: '<svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M7 3.5h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1Z\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\" fill=\"none\"/><path d=\"M14 3.5V8h4.5\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\" fill=\"none\"/><path d=\"M9 13h6M9 16.5h6M9 9.5h2\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"/></svg>',\n  bell: '<svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M6 10.5a6 6 0 0 1 12 0c0 4 1.5 5.3 1.5 5.3H4.5S6 14.5 6 10.5Z\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\" fill=\"none\"/><path d=\"M10 18.5a2 2 0 0 0 4 0\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"/></svg>',\n  refresh: '<svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M4 12a8 8 0 1 1 2.6 5.9\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M4 17v-5h5\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"/></svg>',\n  up: '<svg class=\"icon-sm\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M5 15l7-7 7 7\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"/></svg>',\n  down: '<svg class=\"icon-sm\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M5 9l7 7 7-7\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"/></svg>',\n  lock: '<svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"10.5\" width=\"14\" height=\"9\" rx=\"1.5\" stroke=\"currentColor\" stroke-width=\"1.8\"/><path d=\"M8 10.5V8a4 4 0 0 1 8 0v2.5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" fill=\"none\"/></svg>',\n  unlock: '<svg class=\"icon\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"5\" y=\"10.5\" width=\"14\" height=\"9\" rx=\"1.5\" stroke=\"currentColor\" stroke-width=\"1.8\"/><path d=\"M8 10.5V8a4 4 0 0 1 7.3-2.3\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" fill=\"none\"/></svg>',\n  flowArrow: '<svg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M12 3v13\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/><path d=\"M6 13l6 6 6-6\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"/></svg>',\n  clockOff: '<svg class=\"icon-sm\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M12 6.5V12l3 2\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"/><circle cx=\"12\" cy=\"12\" r=\"8\" stroke=\"currentColor\" stroke-width=\"1.8\" fill=\"none\"/></svg>',\n  gauge: '<svg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M4 15a8 8 0 1 1 16 0\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M12 15 16 9.5\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><circle cx=\"12\" cy=\"15\" r=\"1.3\" fill=\"currentColor\"/></svg>',\n  pen: '<svg viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M4 17.5V20h2.5L18.9 7.6a1.8 1.8 0 0 0 0-2.5l-.1-.1a1.8 1.8 0 0 0-2.5 0L4 17.5Z\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\" fill=\"none\"/><path d=\"M13.5 6 17 9.5\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"/></svg>',\n  stepPump: '<svg class=\"icon-sm\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"11\" cy=\"13\" r=\"6\" stroke=\"currentColor\" stroke-width=\"1.7\"/><path d=\"M11 9.5v7M7.8 13h6.4\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><path d=\"M15.8 9.2 19.5 5.5M19.5 5.5v3M19.5 5.5h-3\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"/></svg>',\n  stepValve: '<svg class=\"icon-sm\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M3 12h5M16 12h5\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><path d=\"M8 8.5 15.5 12 8 15.5Z\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linejoin=\"round\" fill=\"none\"/><path d=\"M12 12v6\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><path d=\"M9 18h6\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"/></svg>',\n  stepTank: '<svg class=\"icon-sm\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M5 6.5h14v11a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 17.5v-11Z\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\" fill=\"none\"/><path d=\"M5 6.5 12 3l7 3.5\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\" fill=\"none\"/><path d=\"M7 13.5h10\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"/></svg>',\n  stepMotor: '<svg class=\"icon-sm\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"4\" y=\"8\" width=\"12\" height=\"8\" rx=\"1.2\" stroke=\"currentColor\" stroke-width=\"1.7\"/><path d=\"M16 11h2.5v2H16\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linejoin=\"round\" fill=\"none\"/><path d=\"M20 10v4M7 8V6M11 8V6\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"/></svg>',\n  stepSensor: '<svg class=\"icon-sm\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M4 15a8 8 0 1 1 16 0\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" fill=\"none\"/><path d=\"M12 15 16 9.5\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"/><circle cx=\"12\" cy=\"15\" r=\"1.3\" fill=\"currentColor\"/></svg>',\n  camera: '<svg class=\"icon-sm\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M4 8.5a1.5 1.5 0 0 1 1.5-1.5h2l1-2h7l1 2h2A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5v-9Z\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\" fill=\"none\"/><circle cx=\"12\" cy=\"13\" r=\"3.2\" stroke=\"currentColor\" stroke-width=\"1.7\"/></svg>'\n};\n\nconst STEP_ICON_TYPES = [\n  { key: 'none', label: 'No icon' },\n  { key: 'pump', label: 'Pump' },\n  { key: 'valve', label: 'Valve' },\n  { key: 'tank', label: 'Tank' },\n  { key: 'motor', label: 'Motor' },\n  { key: 'sensor', label: 'Sensor / Gauge' }\n];\nconst STEP_ICON_SVG = { none: '', pump: ICONS.stepPump, valve: ICONS.stepValve, tank: ICONS.stepTank, motor: ICONS.stepMotor, sensor: ICONS.stepSensor };\n\nconst DEFAULT_STEPS = [\n  { id: 's1', name: 'Thickener open', duration: 5, notes: 'Open thickener discharge valve. Confirm steady feed before proceeding.', noTimer: false, statusType: 'Normal', icon: 'valve',\n    checklist: [] },\n  { id: 's2', name: 'Poly dosing pump ON', duration: 5, notes: '', noTimer: true, statusType: 'Normal', icon: 'pump',\n    checklist: [ { id:'c3', label:'Poly Service Tank', enabled:true, type:'choice', options:['A','B'] }, { id:'c10', label:'Service Tank Initial Level (m)', enabled:true, type:'number', required:true, pairWith:'c11' }, { id:'c11', label:'Service Tank Final Level (m)', enabled:true, type:'number' }, { id:'c12', label:'Tank Level Used (Initial - Final) (m)', enabled:true, type:'calc', calcFrom:['c11','c10'] }, { id:'c5', label:'Suction & Delivery Valve Open', enabled:true, type:'toggle' } ] },\n  { id: 's3', name: 'Thickener Feed Pump-A ON', duration: 20, notes: '', noTimer: false, statusType: 'Normal', icon: 'pump',\n    checklist: [ { id:'c6', label:'Sludge Sump Level', enabled:true, type:'toggle', required:true }, { id:'c7', label:'Dirty Water Sump Level', enabled:true, type:'toggle', required:true } ] },\n  { id: 's4', name: 'Thickener Feed Pump-B ON', duration: 20, notes: '', noTimer: false, statusType: 'Normal', icon: 'pump', checklist: [] },\n  { id: 's5', name: 'Thickener Feed Pump & Poly Dosing Pump Off', duration: 0.5, notes: '', noTimer: false, statusType: 'Normal', icon: 'pump',\n    checklist: [ { id:'c9', label:'Pump service water ON', enabled:true, type:'toggle', required:true } ] },\n  { id: 's6', name: 'Thickener Photo', duration: 0, notes: 'Capture a photo of the thickener showing its current condition.', noTimer: true, statusType: 'Normal', icon: 'tank',\n    checklist: [ { id:'c13', label:'Thickener Photo', enabled:true, type:'photo', required:true } ] }\n];\n\nconst SOP_CONTENT_VERSION = 9; // bump this any time DEFAULT_STEPS content changes, to force every device to reload the latest template\nlet config = { unitName: 'Centrifuge Unit', operatorName: '', frozen: true, contentVersion: SOP_CONTENT_VERSION, steps: JSON.parse(JSON.stringify(DEFAULT_STEPS)) };\nlet runState = {};\nlet editMode = false;\nlet tickHandle = null;\nlet saveNoteTimeout = null;\n\nfunction makeId(){\n  if(window.crypto && typeof window.crypto.randomUUID === 'function') return 's-' + window.crypto.randomUUID();\n  return 's-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);\n}\nfunction makeCheckId(){\n  if(window.crypto && typeof window.crypto.randomUUID === 'function') return 'chk-' + window.crypto.randomUUID();\n  return 'chk-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);\n}\n\n// Reads an image file, downscales it, and returns a compressed JPEG data URL.\n// Keeping photos small matters here because they're stored alongside the rest\n// of the run state and later embedded directly into the PDF report.\nfunction compressImageFile(file){\n  return new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onload = () => {\n      const img = new Image();\n      img.onload = () => {\n        const maxDim = 1000;\n        let { width, height } = img;\n        if(width > maxDim || height > maxDim){\n          const scale = maxDim / Math.max(width, height);\n          width = Math.round(width * scale);\n          height = Math.round(height * scale);\n        }\n        const canvas = document.createElement('canvas');\n        canvas.width = width;\n        canvas.height = height;\n        const ctx = canvas.getContext('2d');\n        ctx.drawImage(img, 0, 0, width, height);\n        resolve(canvas.toDataURL('image/jpeg', 0.72));\n      };\n      img.onerror = () => reject(new Error('Could not load image'));\n      img.src = reader.result;\n    };\n    reader.onerror = () => reject(new Error('Could not read file'));\n    reader.readAsDataURL(file);\n  });\n}\n\nconst CONFIG_KEY = 'centrifuge-sop-config-v2';\nconst RUN_KEY = 'centrifuge-sop-run-v2';\n\n// Storage abstraction: uses the host's persistent window.storage API when available\n// (e.g. running inside Claude), and falls back to the browser's own localStorage\n// so this file also works correctly as a plain, standalone HTML page.\nconst STORAGE = {\n  async get(key){\n    if(window.storage && typeof window.storage.get === 'function'){\n      try{\n        const result = await window.storage.get(key, true);\n        if(result) return result;\n      }catch(e){ /* fall through to localStorage */ }\n    }\n    try{\n      const raw = window.localStorage.getItem(key);\n      return raw !== null ? { key, value: raw } : null;\n    }catch(e){\n      console.error('localStorage read failed', e);\n      return null;\n    }\n  },\n  async set(key, value){\n    if(window.storage && typeof window.storage.set === 'function'){\n      try{\n        const result = await window.storage.set(key, value, true);\n        if(result) return result;\n      }catch(e){ /* fall through to localStorage */ }\n    }\n    window.localStorage.setItem(key, value);\n    return { key, value };\n  }\n};\n\nfunction freshChecks(step){\n  const checks = {};\n  (step.checklist||[]).forEach(c => { checks[c.id] = ''; });\n  return checks;\n}\n\nfunction freshRunState(steps){\n  const state = {};\n  steps.forEach((s, idx) => { state[s.id] = { status:'pending', remaining:(s.duration||0)*60, running:false, lastTick:null, completedAt:null, startedAt:null, alerted:false, checks: freshChecks(s), remark:'' }; });\n  return state;\n}\n\nfunction isLastStep(idx){ return idx === config.steps.length - 1; }\n\nfunction stepRemarkValid(idx, rs){\n  return true; // final remark is optional\n}\n\nfunction stepChecklistValid(s, rs){\n  if(!s.checklist) return { ok:true, missing:[] };\n  const missing = s.checklist.filter(item => {\n    if(item.enabled === false) return false;\n    if(!item.required) return false;\n    const v = rs.checks && rs.checks[item.id];\n    return !(v && String(v).trim());\n  });\n  return { ok: missing.length === 0, missing };\n}\n\nfunction requireStepReady(s, idx, rs){\n  const remarkOk = stepRemarkValid(idx, rs);\n  const remarkEl = document.querySelector(`[data-remark-input=\"${s.id}\"]`);\n  if(remarkEl) remarkEl.classList.toggle('input-error', !remarkOk);\n\n  const checklistCheck = stepChecklistValid(s, rs);\n  (s.checklist||[]).forEach(item => {\n    const el = document.querySelector(`[data-check-id=\"${item.id}\"][data-check-input=\"${s.id}\"]`);\n    if(el) el.classList.toggle('input-error', checklistCheck.missing.includes(item));\n  });\n\n  const errEl = document.querySelector(`[data-step-error=\"${s.id}\"]`);\n  if(errEl){\n    if(!checklistCheck.ok){\n      errEl.textContent = 'Required checklist item(s) missing: ' + checklistCheck.missing.map(m => m.label).join(', ') + '.';\n    } else {\n      errEl.textContent = 'A final remark is required before completing this step.';\n    }\n    errEl.classList.toggle('show', !remarkOk || !checklistCheck.ok);\n  }\n  return remarkOk && checklistCheck.ok;\n}\n\nfunction pad(n){ return n.toString(        const btnRow = document.createElement('div');\n        btnRow.className = 'check-photo-btns';\n        const takeBtn = document.createElement('button');\n        takeBtn.type = 'button';\n        takeBtn.className = 'small' + (hasPhoto ? '' : ' primary');\n        takeBtn.innerHTML = ICONS.camera + '<span>' + (hasPhoto ? 'Retake photo' : 'Add photo') + '</span>';\n        takeBtn.addEventListener('click', () => {\n          if(!requireOperatorName()) return;\n          fileInput.click();\n        });\n        btnRow.appendChild(takeBtn);\n\n        if(hasPhoto){\n          const rmBtn = document.createElement('button');\n          rmBtn.type = 'button';\n          rmBtn.className = 'small danger-btn';\n          rmBtn.innerHTML = ICONS.crossSm + '<span>Remove</span>';\n          rmBtn.addEventListener('click', () => {\n            if(!requireOperatorName()) return;\n            rs.checks[item.id] = '';\n            saveRun(); render();\n          });\n          btnRow.appendChild(rmBtn);\n        }\n        wrap.appendChild(btnRow);\n\n        return wrap;\n      };\n\n      const pairedAwayIds = new Set(s.checklist.filter(it => it.pairWith).map(it => it.pairWith));\n\n      s.checklist.forEach(item => {\n        if(!item.label || !item.label.trim()) return;\n        if(item.enabled === false) return;\n        if(pairedAwayIds.has(item.id)) return; // rendered inline alongside the item that pairs with it\n\n        if(item.pairWith){\n          const pairItem = s.checklist.find(x => x.id === item.pairWith && x.label && x.label.trim() && x.enabled !== false);\n          if(pairItem){\n            checkNum++; const num1 = checkNum;\n            checkNum++; const num2 = checkNum;\n            const row = document.createElement('div');\n            row.className = 'check-item-row check-item-row-pair';\n            [[item, num1], [pairItem, num2]].forEach(([it, n]) => {\n              const field = document.createElement('div');\n              field.className = 'check-pair-field';\n              field.appendChild(buildLabel(it, n));\n              field.appendChild(buildValueInput(it));\n              row.appendChild(field);\n            });\n            checklistRow.appendChild(row);\n            return;\n          }\n        }\n\n        checkNum++;\n        const row = document.createElement('div');\n        row.className = 'check-item-row';\n        row.appendChild(buildLabel(item, checkNum));\n\n        if(item.type === 'checkbox'){\n          const cbWrap = document.createElement('label');\n          cbWrap.className = 'check-checkbox-wrap' + (rs.checks[item.id] === 'Yes' ? ' checked' : '');\n          cbWrap.setAttribute('data-check-input', s.id);\n          cbWrap.setAttribute('data-check-id', item.id);\n          const cb = document.createElement('input');\n          cb.type = 'checkbox';\n          cb.checked = rs.checks[item.id] === 'Yes';\n          cb.addEventListener('change', () => {\n            if(!requireOperatorName()){ cb.checked = rs.checks[item.id] === 'Yes'; return; }\n            rs.checks[item.id] = cb.checked ? 'Yes' : '';\n            cbWrap.classList.toggle('checked', cb.checked);\n            saveRun();\n          });\n          cbWrap.appendChild(cb);\n          const cbText = document.createElement('span');\n          cbText.textContent = 'Checked';\n          cbWrap.appendChild(cbText);\n          row.appendChild(cbWrap);\n        } else if(item.type === 'choice'){\n          const choiceWrap = document.createElement('div');\n          choiceWrap.className = 'check-toggle-wrap';\n          choiceWrap.setAttribute('data-check-input', s.id);\n          choiceWrap.setAttribute('data-check-id', item.id);\n          const current = rs.checks[item.id] || '';\n          const opts = Array.isArray(item.options) && item.options.length ? item.options : ['A','B'];\n          opts.forEach(opt => {\n            const btn = document.createElement('button');\n            btn.type = 'button';\n            btn.className = 'small check-toggle-btn choice-btn' + (current === opt ? ' choice-on' : '');\n            btn.innerHTML = '<span>' + opt + '</span>';\n            btn.addEventListener('click', () => {\n              if(!requireOperatorName()) return;\n              rs.checks[item.id] = (rs.checks[item.id] === opt) ? '' : opt;\n              saveRun(); render();\n            });\n            choiceWrap.appendChild(btn);\n          });\n          row.appendChild(choiceWrap);\n        } else if(item.type === 'calc'){\n          const [fromId, toId] = item.calcFrom || [];\n          const a = parseFloat(rs.checks[fromId]);\n          const b = parseFloat(rs.checks[toId]);\n          const calcInput = document.createElement('input');\n          calcInput.type = 'text';\n          calcInput.className = 'check-value calc-value';\n          calcInput.disabled = true;\n          calcInput.value = (!isNaN(a) && !isNaN(b)) ? (b - a).toFixed(2) : '\u2014';\n          row.appendChild(calcInput);\n        } else if(item.type === 'toggle'){\n          const toggleWrap = document.createElement('div');\n          toggleWrap.className = 'check-toggle-wrap';\n          toggleWrap.setAttribute('data-check-input', s.id);\n          toggleWrap.setAttribute('data-check-id', item.id);\n          const current = rs.checks[item.id] || '';\n          ['Yes','No'].forEach(opt => {\n            const btn = document.createElement('button');\n            btn.type = 'button';\n            btn.className = 'small check-toggle-btn' + (current === opt ? (opt === 'Yes' ? ' toggle-yes-on' : ' toggle-no-on') : '');\n            btn.innerHTML = (opt === 'Yes' ? ICONS.check.replace('icon','icon-sm') : ICONS.cross.replace('icon','icon-sm')) + '<span>' + opt + '</span>';\n            btn.addEventListener('click', () => {\n              if(!requireOperatorName()) return;\n              rs.checks[item.id] = (rs.checks[item.id] === opt) ? '' : opt;\n              saveRun(); render();\n            });\n            toggleWrap.appendChild(btn);\n          });\n          row.appendChild(toggleWrap);\n        } else if(item.type === 'photo'){\n          row.appendChild(buildPhotoInput(item));\n        } else {\n          row.appendChild(buildValueInput(item));\n        }\n\n        checklistRow.appendChild(row);\n      });\n      if(checklistRow.children.length) body.appendChild(checklistRow);\n    }\n\n    const controls = document.createElement('div');\n    controls.className = 'step-controls';\n\n    if(!s.noTimer){\n      const timer = document.createElement('div');\n      timer.className = 'timer';\n      timer.setAttribute('data-timer', s.id);\n      const f = fmt(rs.remaining);\n      timer.textContent = f.text;\n      if(f.overrun && rs.running) timer.classList.add('overrun');\n      controls.appendChild(timer);\n\n      const ctrlBtns = document.createElement('div');\n      ctrlBtns.className = 'ctrl-btns';\n\n      const playBtn = document.createElement('button');\n      playBtn.className = 'small ' + (rs.running ? 'danger-btn' : 'primary');\n      playBtn.innerHTML = (rs.running ? ICONS.pause : ICONS.play) + '<span>' + (rs.running ? 'Pause' : 'Start') + '</span>';\n      playBtn.addEventListener('click', () => {\n        if(!runState[s.id]) runState[s.id] = { status:'pending', remaining:s.duration*60, running:false, completedAt:null, startedAt:null, alerted:false, checks:freshChecks(s), remark:'' };\n        const r = runState[s.id];\n        // user gesture: safe point to unlock/create the audio context for the alert sound\n        if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }\n        else if(audioCtx.state === 'suspended'){ audioCtx.resume(); }\n        r.running = !r.running;\n        r.lastTick = Date.now();\n        if(r.running && r.remaining > 0) r.alerted = false;\n        // Record the first time this step's timer is actually started, so the\n        // report can show a from/to range rather than just the finish time.\n        if(r.running && !r.startedAt) r.startedAt = new Date().toISOString();\n        saveRun(); render();\n      });\n      ctrlBtns.appendChild(playBtn);\n\n      const resetBtn = document.createElement('button');\n      resetBtn.className = 'small locked-btn';\n      resetBtn.innerHTML = ICONS.reset + '<span>Reset</span>';\n      resetBtn.addEventListener('click', () => {\n        runState[s.id] = { status: rs.status, remaining: s.duration*60, running:false, lastTick:null, completedAt: rs.completedAt, startedAt:null, alerted:false, checks: rs.checks, remark: rs.remark };\n        saveRun(); render();\n      });\n      ctrlBtns.appendChild(resetBtn);\n\n      controls.appendChild(ctrlBtns);\n    }\n\n    const completeWrap = document.createElement('div');\n    completeWrap.className = 'complete-toggle';\n\n    const okBtn = document.createElement('button');\n    okBtn.className = 'small icon-btn' + (rs.status === 'complete' ? ' checked' : '');\n    okBtn.title = rs.status === 'complete' ? 'Marked complete \u2014 tap to undo' : 'Mark OK / complete';\n    okBtn.setAttribute('aria-label', okBtn.title);\n    okBtn.innerHTML = ICONS.check;\n    okBtn.addEventListener('click', () => {\n      if(!requireOperatorName()) return;\n      if(!runState[s.id]) runState[s.id] = { status:'pending', remaining:s.duration*60, running:false, completedAt:null, startedAt:null, alerted:false, checks:freshChecks(s), remark:'' };\n      const r = runState[s.id];\n      const turningOn = r.status !== 'complete';\n      if(turningOn && !requireStepReady(s, idx, r)) return;\n      r.status = turningOn ? 'complete' : 'pending';\n      if(r.status === 'complete'){ r.running = false; r.completedAt = new Date().toISOString(); }\n      else { r.completedAt = null; }\n      saveRun(); render();\n    });\n    completeWrap.appendChild(okBtn);\n\n    const issueBtn = document.createElement('button');\n    issueBtn.className = 'small icon-btn' + (rs.status === 'issue' ? ' issue-checked' : '');\n    issueBtn.title = rs.status === 'issue' ? 'Flagged as not OK \u2014 tap to undo' : 'Flag as not OK / wrong';\n    issueBtn.setAttribute('aria-label', issueBtn.title);\n    issueBtn.innerHTML = ICONS.cross;\n    issueBtn.addEventListener('click', () => {\n      if(!requireOperatorName()) return;\n      if(!runState[s.id]) runState[s.id] = { status:'pending', remaining:s.duration*60, running:false, completedAt:null, startedAt:null, alerted:false, checks:freshChecks(s), remark:'' };\n      const r = runState[s.id];\n      const turningOn = r.status !== 'issue';\n      if(turningOn && !requireStepReady(s, idx, r)) return;\n      const confirmMsg = turningOn\n        ? 'Flag \"' + (s.name && s.name.trim() ? s.name.trim() : 'step ' + (idx+1)) + '\" as not OK / an issue?'\n        : 'Undo the issue flag on this step?';\n      if(!window.confirm(confirmMsg)) return;\n      r.status = turningOn ? 'issue' : 'pending';\n      if(r.status === 'issue'){ r.running = false; r.completedAt = new Date().toISOString(); }\n      else { r.completedAt = null; }\n      saveRun(); render();\n    });\n    completeWrap.appendChild(issueBtn);\n\n    controls.appendChild(completeWrap);\n\n    body.appendChild(controls);\n\n    const stepError = document.createElement('div');\n    stepError.className = 'step-field-error';\n    stepError.setAttribute('data-step-error', s.id);\n    body.appendChild(stepError);\n\n    if(rs.status !== 'pending' && rs.completedAt){\n      const completedNote = document.createElement('div');\n      completedNote.style.cssText = 'font-size:11.5px;color:' + (rs.status === 'issue' ? 'var(--red)' : 'var(--text-faint)') + ';margin-top:6px;';\n      completedNote.textContent = (rs.status === 'issue' ? 'Flagged as not OK at ' : 'Completed at ') + formatTimestamp(rs.completedAt);\n      body.appendChild(completedNote);\n    }\n\n    if(!editMode && isLastStep(idx)){\n      const remarkWrap = document.createElement('div');\n      remarkWrap.className = 'remark = issueCount > 0\n      ? '<span>' + ICONS.cross + ' All steps reviewed \u2014 ' + issueCount + ' flagged as not OK. Resolve before sign-off.</span>'\n      : '<span>' + ICONS.check + ' All steps complete \u2014 ready to generate the shift report.</span>';\n    const genBtn = document.createElement('button');\n    genBtn.className = 'small ' + (issueCount > 0 ? 'danger-btn' : 'green-btn');\n    genBtn.innerHTML = ICONS.report + '<span>Generate PDF report</span>';\n    genBtn.addEventListener('click', generateReport);\n    banner.appendChild(genBtn);\n  }\n\n  const reportBtn = document.getElementById('reportBtn');\n  reportBtn.classList.toggle('primary', allReviewed && issueCount === 0);\n}\n\nfunction formatTimestamp(iso){\n  try{\n    const d = new Date(iso);\n    return d.toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });\n  }catch(e){ return iso; }\n}\n\n// Short HH:MM form, used for the from/to timer range in the report \u2014 the\n// full date is already shown once for the whole run, so repeating it in\n// every row's time range would just add clutter.\nfunction formatTimeOnly(iso){\n  try{\n    const d = new Date(iso);\n    return d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });\n  }catch(e){ return iso; }\n}\n\ndocument.getElementById('unitName').addEventListener('change', (e) => {\n  if(config.frozen){ e.target.value = config.unitName || 'Centrifuge Unit'; return; }\n  config.unitName = e.target.value || 'Centrifuge Unit';\n  saveConfig();\n});\n\ndocument.getElementById('operatorName').addEventListener('change', (e) => {\n  config.operatorName = e.target.value || '';\n  saveConfig();\n  requireOperatorName();\n});\ndocument.getElementById('operatorName').addEventListener('input', (e) => {\n  if(e.target.value && e.target.value.trim()){\n    e.target.classList.remove('input-error');\n    document.getElementById('operatorError').style.display = 'none';\n  }\n});\n\n// Steps are permanently fixed for every user \u2014 there is no edit or unlock\n// control. config.frozen is always true (see loadAll) and editMode never\n// switches on, so the step list, durations and check items can't be\n// changed by anyone the file is shared with.\n\ndocument.getElementById('addStep').addEventListener('click', async () => {\n  if(config.frozen) return;\n  const addBtn = document.getElementById('addStep');\n  addBtn.disabled = true;\n  try{\n    const newId = makeId();\n    config.steps.push({ id:newId, name:'', duration:5, notes:'', noTimer:false, statusType:'Normal', checklist:[] });\n    runState[newId] = { status:'pending', remaining:5*60, running:false, lastTick:null, completedAt:null, startedAt:null, alerted:false, checks:{}, remark:'' };\n    editMode = true;\n    render();\n    const [configOk, runOk] = await Promise.all([saveConfig(), saveRun()]);\n    if(!configOk || !runOk){\n      alert('The new step could not be saved. Please check your connection and try again \u2014 use the \"tap to retry\" note under the progress bar.');\n    }\n  } finally {\n    addBtn.disabled = false;\n  }\n});\n\nfunction moveStep(id, direction){\n  const idx = config.steps.findIndex(s => s.id === id);\n  if(idx === -1) return;\n  const swapIdx = idx + direction;\n  if(swapIdx < 0 || swapIdx >= config.steps.length) return;\n  const tmp = config.steps[idx];\n  config.steps[idx] = config.steps[swapIdx];\n  config.steps[swapIdx] = tmp;\n  saveConfig();\n  render();\n}\n\nfunction moveCheckItem(step, checkId, direction){\n  if(!Array.isArray(step.checklist)) return;\n  const idx = step.checklist.findIndex(c => c.id === checkId);\n  if(idx === -1) return;\n  const swapIdx = idx + direction;\n  if(swapIdx < 0 || swapIdx >= step.checklist.length) return;\n  const tmp = step.checklist[idx];\n  step.checklist[idx] = step.checklist[swapIdx];\n  step.checklist[swapIdx] = tmp;\n  saveConfig();\n  render();\n}\n\ndocument.getElementById('reportBtn').addEventListener('click', generateReport);\n\nfunction generateReport(){\n  try{\n    // Commit any field the operator is still actively typing in (e.g. the\n    // final remark or a check-item reading) before reading state into the PDF.\n    if(document.activeElement && typeof document.activeElement.blur === 'function'){\n      document.activeElement.blur();\n    }\n    if(!window.jspdf || !window.jspdf.jsPDF){\n      alert('Report library is still loading \u2014 try again in a moment.');\n      return;\n    }\n\n    if(!requireOperatorName()){\n      alert('Operator name is required before a report can be generated. Please enter it at the top of the page.');\n      return;\n    }\n\n    const { jsPDF } = window.jspdf;\n    const doc = new jsPDF({ unit: 'pt', format: 'a4' });\n    const pageWidth = doc.internal.pageSize.getWidth();\n    const marginX = 40;\n    const usableWidth = pageWidth - marginX * 2;\n    const completeCount = config.steps.filter(s => runState[s.id] && runState[s.id].status === 'complete').length;\n    const issueCount = config.steps.filter(s => runState[s.id] && runState[s.id].status === 'issue').length;\n    const total = config.steps.length;\n    const now = new Date();\n\n    // Header is built top-to-bottom with a running cursor so long unit\n    // names or operator names wrap onto their own lines instead of\n    // overwriting the text next to them.\n    let cursorY = 52;\n\n    doc.setFont('helvetica', 'bold');\n    doc.setFontSize(18);\n    doc.setTextColor(34, 38, 42);\n    const titleLines = doc.splitTextToSize(config.unitName || 'Centrifuge Unit', usableWidth);\n    doc.text(titleLines, marginX, cursorY);\n    cursorY += 22 * titleLines.length + 8;\n\n    // A thin accent rule stands in for the old \"Operator SOP Report\"\n    // subtitle line, separating the title from the run details below\n    // without an extra line of text.\n    doc.setDrawColor(44, 95, 130);\n    doc.setLineWidth(1.4);\n    doc.line(marginX, cursorY, marginX + usableWidth, cursorY);\n    doc.setLineWidth(0.5);\n    cursorY += 22;\n\n    // Operator (left) and generated timestamp (right) share one row.\n    doc.setFont('helvetica', 'normal');\n    doc.setFontSize(10);\n    doc.setTextColor(91, 96, 103);\n    const operatorLines = doc.splitTextToSize('Operator: ' + config.operatorName.trim(), usableWidth * 0.6);\n    doc.text(operatorLines, marginX, cursorY);\n    doc.text('Generated ' + now.toLocaleString(), marginX + usableWidth, cursorY, { align: 'right' });\n    cursorY += 15 * operatorLines.length + 18;\n\n    // Status is a rounded, colored pill rather than plain bold text, so\n    // the overall run outcome reads at a glance.\n    const badgeColor = issueCount > 0 ? [185, 59, 44] : (completeCount === total ? [31, 122, 70] : [180, 101, 11]);\n    let statusLine = completeCount + ' of ' + total + ' steps complete';\n    if(issueCount > 0) statusLine += ' \\u00b7 ' + issueCount + ' issue' + (issueCount > 1 ? 's' : '');\n    doc.setFont('helvetica', 'bold');\n    doc.setFontSize(10);\n    const badgePaddingX = 11;\n    const badgeH = 21;\n    const badgeW = doc.getTextWidth(statusLine) + badgePaddingX * 2;\n    doc.setFillColor(badgeColor[0], badgeColor[1], badgeColor[2]);\n    doc.roundedRect(marginX, cursorY, badgeW, badgeH, badgeH / 2, badgeH / 2, 'F');\n    doc.setTextColor(255, 255, 255);\n    doc.text(statusLine, marginX + badgePaddingX, cursorY + badgeH / 2 + 3.5);\n    doc.setTextColor(34, 38, 42);\n    cursorY += badgeH + 20;\n\n    const noteBlocksByRow = [];\n    const rows = config.steps.map((s, idx) => {\n      const rs = runState[s.id] || {};\n      const statusLabel = rs.status === 'complete' ? 'Complete' : (rs.status === 'issue' ? 'Issue' : 'Incomplete');\n      let noteText = s.notes && s.notes.trim() ? s.notes.trim() : '';\n      if(s.statusType === 'Abnormal') noteText = '[Abnormal] ' + noteText;\n      // blocks mirrors noteText line-for-line, but keeps the label/value\n      // split for each checklist reading so it can be redrawn with the\n      // entered value in red (see didDrawCell below). Plain notes text\n      // is not an \"entry\" and stays the default color.\n      const blocks = noteText ? [{ text: noteText, isEntry: false }] : [];\n      // Poly Service Tank Initial/Final/Used levels (step \"Poly dosing pump ON\",\n      // check items c10/c11/c12) get their own dedicated report columns instead\n      // of being folded into the Notes text like other checklist readings.\n      let polyInitial = '\\u2014', polyFinal = '\\u2014', polyUsed = '\\u2014';\n      if(s.checklist && s.checklist.length){\n        const initItem = s.checklist.find(c => c.id === 'c10' && c.enabled !== false);\n        const finalItem = s.checklist.find(c => c.id === 'c11' && c.enabled !== false);\n        const usedItem = s.checklist.find(c => c.id === 'c12' && c.enabled !== false);\n        if(initItem){\n          const v = rs.checks && rs.checks[initItem.id] ? String(rs.checks[initItem.id]).trim() : '';\n          polyInitial = v || '\\u2014';\n        }\n        if(finalItem){\n          const v = rs.checks && rs.checks[finalItem.id] ? String(rs.checks[finalItem.id]).trim() : '';\n          polyFinal = v || '\\u2014';\n        }\n        if(usedItem){\n          const [fromId, toId] = usedItem.calcFrom || ['c10', 'c11'];\n          const a = parseFloat(rs.checks && rs.checks[fromId]);\n          const b = parseFloat(rs.checks && rs.checks[toId]);\n          polyUsed = (!isNaN(a) && !isNaN(b)) ? (b - a).toFixed(2) : '\\u2014';\n        }\n      }\n      if(s.checklist && s.checklist.length){\n        const checkLines = s.checklist\n          .filter(c => c.label && c.label.trim() && c.enabled !== false && c.id !== 'c10' && c.id !== 'c11' && c.id !== 'c12')\n          .map(c => {\n            const val = rs.checks && rs.checks[c.id] && String(rs.checks[c.id]).trim() ? String(rs.checks[c.id]).trim() : '';\n            if(c.type === 'toggle' || c.type === 'checkbox'){\n              const shown = val === 'Yes' ? 'Yes' : (val === 'No' ? 'No' : 'Not entered');\n              return { label: c.label.trim(), value: shown, entered: shown !== 'Not entered' };\n            }\n            if(c.type === 'calc'){\n              const [fromId, toId] = c.calcFrom || [];\n              const a = parseFloat(rs.checks && rs.checks[fromId]);\n              const b = parseFloat(rs.checks && rs.checks[toId]);\n              const shown = (!isNaN(a) && !isNaN(b)) ? (b - a).toFixed(2) : 'Not entered';\n              return { label: c.label.trim(), value: shown, entered: shown !== 'Not entered' };\n            }\n            if(c.type === 'photo'){\n              const hasPhoto = !!(val && val.indexOf('data:image') === 0);\n              const shown = hasPhoto ? 'Photo attached (see below)' : 'Not captured';\n              return { label: c.label.trim(), value: shown, entered: hasPhoto };\n            }\n            const shown = val || 'Not entered';\n            return { label: c.label.trim(), value: shown, entered: !!val };\n          });\n        checkLines.forEach(c => {\n          blocks.push({ text: c.label + ': ' + c.value, isEntry: c.entered, label: c.label + ': ', value: c.value });\n        });\n        if(checkLines.length) noteText = (noteText ? noteText + '\\n' : '') + checkLines.map(c => c.label + ': ' + c.value).join('\\n');\n      }\n      noteBlocksByRow.push(blocks);\n      // Show the timer as a from/to range (when it was actually started and\n      // finished) rather than just the finish time, so it's clear how long\n      // the step actually ran, not only when it wrapped up.\n      let timeCell = '\\u2014';\n      if(s.noTimer){\n        timeCell = rs.status !== 'pending' && rs.completedAt ? formatTimestamp(rs.completedAt) : '\\u2014';\n      } else if(rs.startedAt && rs.status !== 'pending' && rs.completedAt){\n        timeCell = formatTimeOnly(rs.startedAt) + '\\nto ' + formatTimeOnly(rs.completedAt);\n      } else if(rs.status !== 'pending' && rs.completedAt){\n        // Older/legacy runs that never recorded a start time still show the\n        // completion time rather than nothing.\n        timeCell = formatTimestamp(rs.completedAt);\n      }\n      return [\n        String(idx + 1),\n        s.name && s.name.trim() ? s.name : '(untitled step)',\n        s.noTimer ? 'No timer' : (s.duration || 0) + ' min',\n        statusLabel,\n        timeCell,\n        polyInitial,\n        polyFinal,\n        polyUsed,\n        noteText\n      ];\n    });\n\n    doc.autoTable({\n      startY: cursorY,\n      margin: { left: marginX, right: marginX },\n      head: [['#', 'Step', 'Duration', 'Status', 'Timer\\n(Start to End)', 'Poly Init\\n(m)', 'Poly Final\\n(m)', 'Poly Used\\n(m)', 'Notes']],\n      body: rows,\n      styles: { font: 'helvetica', fontSize: 9, cellPadding: 8, valign: 'top', lineColor: [216, 214, 206], lineWidth: 0.5, overflow: 'linebreak', lineHeightFactor: 1.3 },\n      headStyles: { fillColor: [44, 95, 130], textColor: 255, fontStyle: 'bold', cellPadding: 8, overflow: 'linebreak', fontSize: 9, halign: 'left' },\n      alternateRowStyles: { fillColor: [245, 244, 240] },\n      columnStyles: {\n        0: { cellWidth: usableWidth * 0.03 },\n        1: { cellWidth: usableWidth * 0.12 },\n        2: { cellWidth: usableWidth * 0.09 },\n        3: { cellWidth: usableWidth * 0.08 },\n        4: { cellWidth: usableWidth * 0.13 },\n        5: { cellWidth: usableWidth * 0.09, halign: 'center' },\n        6: { cellWidth: usableWidth * 0.09, halign: 'center' },\n        7: { cellWidth: usableWidth * 0.09, halign: 'center' },\n        // A fixed width (not 'auto') is required here: 'auto' columns size\n        // themselves to their content instead of the page, so a long line\n        // like \"Suction/Delivery valve open: Yes\" was printed as one\n        // straight line running off the edge instead of wrapping.\n        8: { cellWidth: usableWidth * 0.28 }\n      },\n      didParseCell: function(data){\n        if(data.section === 'body' && data.column.index === 3){\n          const raw = String(data.cell.raw || '');\n          if(raw.indexOf('Complete') !== -1){ data.cell.styles.textColor = [31, 122, 70]; data.cell.styles.fontStyle = 'bold'; }\n          else if(raw.indexOf('Issue') !== -1){ data.cell.styles.textColor = [185, 59, 44]; data.cell.styles.fontStyle = 'bold'; }\n          else{ data.cell.styles.textColor = [180, 101, 11]; }\n        }\n      },\n      didDrawCell: function(data){\n        // Redraw the Notes column ourselves so a checklist item's entered\n        // value (e.g. \"Yes\", a reading, a photo confirmation) prints in red\n        // while its label and any plain step notes stay the default color.\n        if(data.section !== 'body' || data.column.index !== 8) return;\n        const blocks = noteBlocksByRow[data.row.index];\n        if(!blocks || !blocks.length) return;\n\n        const padX = 8, padY = 8;\n        const availW = data.cell.width - padX * 2;\n        const lineH = 11.5;\n\n        // Cover the default black text autoTable already drew, staying\n        // inset from the cell edges so the grid lines are left untouched.\n        const fill = Array.isArray(data.cell.styles.fillColor) ? data.cell.styles.fillColor : [255, 255, 255];\n        doc.setFillColor(fill[0], fill[1], fill[2]);\n        doc.rect(data.cell.x + 0.6, data.cell.y + 0.6, data.cell.width - 1.2, data.cell.height - 1.2, 'F');\n\n        doc.setFont('helvetica', 'normal');\n        doc.setFontSize(9);\n        let y = data.cell.y + padY + 7;\n        const x = data.cell.x + padX;\n\n        blocks.forEach(block => {\n          if(block.label !== undefined){\n            const oneLineWidth = doc.getTextWidth(block.label) + doc.getTextWidth(block.value);\n            if(oneLineWidth <= availW){\n              // Fits on one line: label in the default color, and the\n              // value in red only when the operator actually entered\n              // something \\u2014 \"Not entered\"/\"Not captured\" stays neutral.\n              doc.setTextColor(34, 38, 42);\n              doc.text(block.label, x, y);\n              if(block.isEntry){ doc.setTextColor(196, 44, 44); }\n              doc.text(block.value, x + doc.getTextWidth(block.label), y);\n              y += lineH;\n              return;\n            }\n          }\n          // Plain text, or an entry too long to fit one line \\u2014 wrap and\n          // draw normally rather than risk misplacing the color split.\n          doc.setTextColor(34, 38, 42);\n          const lines = doc.splitTextToSize(block.text, availW);\n          doc.text(lines, x, y);\n          y += lineH * lines.length;\n        });\n        doc.setTextColor(34, 38, 42);\n      }\n    });\n\n    let finalY = doc.lastAutoTable.finalY || cursorY;\n    const pageHeight = doc.internal.pageSize.getHeight();\n\n    // The final remark gets its own labeled, bordered box rather than being\n    // folded into the last step's Notes cell \u2014 it's a closing statement\n    // about the whole run, not a note about one step, so it reads better\n    // set apart from the table.\n    const lastStepId = config.steps.length ? config.steps[config.steps.length - 1].id : null;\n    const finalRemark = lastStepId && runState[lastStepId] && runState[lastStepId].remark\n      ? String(runState[lastStepId].remark).trim() : '';\n    if(finalRemark){\n      const boxPadding = 11;\n      const labelH = 16;\n      doc.setFont('helvetica', 'normal');\n      doc.setFontSize(9.5);\n      const remarkLines = doc.splitTextToSize(finalRemark, usableWidth - boxPadding * 2);\n      const lineH = 14;\n      const boxH = labelH + remarkLines.length * lineH + boxPadding * 2;\n      const boxY = finalY + 18;\n\n      doc.setDrawColor(216, 214, 206);\n      doc.setFillColor(250, 249, 246);\n      doc.roundedRect(marginX, boxY, usableWidth, boxH, 3, 3, 'FD');\n\n      doc.setFont('helvetica', 'bold');\n      doc.setFontSize(9.5);\n      doc.setTextColor(91, 96, 103);\n      doc.text('FINAL REMARK', marginX + boxPadding, boxY + boxPadding + 7);\n\n      doc.setFont('helvetica', 'normal');\n      doc.setTextColor(34, 38, 42);\n      doc.text(remarkLines, marginX + boxPadding, boxY + boxPadding + labelH + 8);\n\n      finalY = boxY + boxH;\n    }\n\n    // Any 'photo' checklist items with a captured image get embedded\n    // below the table, each labeled with its step and item name. The\n    // report must stay a single page, so photos are scaled DOWN to\n    // whatever vertical space remains instead of overflowing to a new\n    // page (no doc.addPage() calls here).\n    const bottomMargin = 40;\n    let photoY = finalY + 24;\n    // Collect photos first so multiple photos can share the remaining\n    // space fairly instead of the first one claiming it all.\n    const photosToPlace = [];\n    config.steps.forEach(s => {\n      const rs = runState[s.id] || {};\n      (s.checklist || []).forEach(item => {\n        if(item.type !== 'photo' || item.enabled === false) return;\n        const dataUrl = rs.checks && rs.checks[item.id];\n        if(!dataUrl || typeof dataUrl !== 'string' || dataUrl.indexOf('data:image') !== 0) return;\n        let imgProps;\n        try{ imgProps = doc.getImageProperties(dataUrl); }catch(e){ return; }\n        photosToPlace.push({ s, item, dataUrl, imgProps });\n      });\n    });\n\n    if(photosToPlace.length){\n      const captionH = 14;\n      const gapAfter = 18;\n      const totalAvailableH = Math.max(30, pageHeight - bottomMargin - photoY - (captionH + gapAfter) * photosToPlace.length);\n      const perPhotoH = totalAvailableH / photosToPlace.length;\n      const maxW = usableWidth * 0.55;\n\n      photosToPlace.forEach(({ s, item, dataUrl, imgProps }) => {\n        let w = Math.min(maxW, imgProps.width);\n        let h = w * (imgProps.height / imgProps.width);\n        // Scale to fit the height each photo was allotted, never\n        // pushing content past the bottom margin or onto a new page.\n        if(h > perPhotoH){\n          h = perPhotoH;\n          w = h * (imgProps.width / imgProps.height);\n        }\n\n        doc.setFont('helvetica', 'bold');\n        doc.setFontSize(10);\n        doc.setTextColor(34, 38, 42);\n        const caption = (item.label && item.label.trim() ? item.label.trim() : 'Photo') + ' \\u2014 ' + (s.name && s.name.trim() ? s.name.trim() : 'Step');\n        doc.text(caption, marginX, photoY);\n        photoY += captionH;\n\n        const fmt = dataUrl.indexOf('data:image/png') === 0 ? 'PNG' : 'JPEG';\n        doc.addImage(dataUrl, fmt, marginX, photoY, w, h);\n        photoY += h + gapAfter;\n      });\n    }\n    finalY = photoY;\n\n    doc.setFontSize(9);\n    doc.setTextColor(139, 144, 150);\n    doc.text('Generated with the operator SOP checklist tool.', marginX, finalY + 10);\n    doc.text('Page ' + doc.internal.getNumberOfPages(), marginX + usableWidth, finalY + 10, { align: 'right' });\n\n    const safeName = (config.unitName || 'centrifuge-unit').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');\n    const stamp = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0')\n      + '-' + String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');\n    doc.save(safeName + '-sop-report-' + stamp + '.pdf');\n\n    // Report is the shift's official record \u2014 once it's out, clear the run\n    // so the next shift starts from a clean slate instead of the last one's state.\n    runState = freshRunState(config.steps);\n    saveRun(); render();\n  }catch(e){\n    console.error('report generation failed', e);\n    alert('Could not generate the report. Please try again.');\n  }\n}\n\ndocument.getElementById('reportBtn').innerHTML = ICONS.report + '<span>Report</span>';\ndocument.getElementById('addStep').innerHTML = ICONS.plus + '<span>Add step</span>';\ndocument.getElementById('eyebrowLabel').innerHTML = ICONS.gauge + '<span>CENTRIFUGE UNIT \u2014 OPERATOR SOP</span>';\ndocument.getElementById('signoffTitle').innerHTML = ICONS.pen + '<span>Sign-off</span>';\n\n\nloadAll();\n<\/script>\n</body>\n</html>\n";
  var CHEM_HTML = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap\" rel=\"stylesheet\">\n<title>WTP Dosing Calculator \u2014 Alum / Lime</title>\n<style>\n  :root{\n    --ink:#000b3d;\n    --paper:#eef2f6;\n    --panel:#ffffff;\n    --line:#cdd6e3;\n    --teal:#a4da05;\n    --teal-deep:#000b3d;\n    --amber:#c07a1e;\n    --mono: 'JetBrains Mono', 'Courier New', monospace;\n    --sans: 'Inter', 'Segoe UI', Arial, sans-serif;\n  }\n  *{box-sizing:border-box;}\n  body{\n    margin:0;\n    font-family:var(--sans);\n    font-weight:600;\n    background:\n      radial-gradient(circle at 100% 0%, rgba(164,218,5,0.10), transparent 45%),\n      repeating-linear-gradient(0deg, rgba(164,218,5,0.05) 0px, rgba(164,218,5,0.05) 1px, transparent 1px, transparent 24px),\n      repeating-linear-gradient(90deg, rgba(164,218,5,0.05) 0px, rgba(164,218,5,0.05) 1px, transparent 1px, transparent 24px),\n      var(--paper);\n    color:var(--ink);\n    padding:24px 12px 44px;\n    -webkit-font-smoothing:antialiased;\n  }\n  .wrap{max-width:760px;margin:0 auto;}\n\n  .head{\n    display:flex; align-items:center; justify-content:space-between;\n    background:var(--panel);\n    border:1px solid var(--line);\n    border-top:4px solid var(--teal);\n    border-radius:10px;\n    padding:16px 20px;\n    margin-bottom:22px;\n    box-shadow:0 2px 10px rgba(0,11,61,0.06);\n  }\n  .brand{display:flex; align-items:center; gap:13px;}\n  .brand svg{filter:drop-shadow(0 1px 2px rgba(0,11,61,0.15));}\n  .brand-text{display:flex; flex-direction:column;}\n  .head h1{\n    font-size:18px; letter-spacing:0.3px; margin:0; text-transform:uppercase; line-height:1.25;\n  }\n  .project-name{\n    font-family:var(--mono); font-size:12px; color:var(--teal-deep); font-weight:600;\n    letter-spacing:0.5px; margin-top:3px; opacity:0.75;\n  }\n  .head .tag{\n    font-family:var(--mono); font-size:10.5px; color:var(--teal-deep);\n    background:rgba(164,218,5,0.16); border:1px solid var(--teal);\n    padding:4px 10px; border-radius:20px; white-space:nowrap;\n  }\n  .subtitle{font-size:12.5px; color:#5a6f8c; margin:-12px 0 20px; font-family:var(--mono); text-align:center; opacity:0.85;}\n\n  .panel{\n    background:var(--panel);\n    border:1px solid var(--line);\n    border-radius:10px;\n    padding:20px 22px;\n    margin-bottom:18px;\n    box-shadow:0 2px 10px rgba(0,11,61,0.05);\n  }\n  .panel-label{\n    font-family:var(--mono); font-size:11px; letter-spacing:1.5px;\n    text-transform:uppercase; color:var(--teal-deep); margin-bottom:16px;\n    display:flex; align-items:center; gap:9px;\n  }\n  .panel-label::before{\n    content:''; width:9px; height:9px; background:var(--teal); display:inline-block;\n    border-radius:2px; transform:rotate(45deg);\n    box-shadow:0 0 0 3px rgba(164,218,5,0.18);\n  }\n\n  .chem-toggle{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}\n  .chem-btn{\n    flex:1; min-width:80px; padding:11px 8px; text-align:center; border:1.5px solid var(--line);\n    border-radius:8px; cursor:pointer; font-size:12px; font-weight:700;\n    background:#f6f9fc; color:#5a6f8c; transition:all .18s ease;\n    letter-spacing:0.2px;\n  }\n  .chem-btn:hover{border-color:var(--teal); color:var(--teal-deep); transform:translateY(-1px);}\n  .chem-btn.active{\n    background:var(--teal); color:var(--teal-deep); border-color:var(--teal);\n    box-shadow:0 3px 10px rgba(164,218,5,0.4);\n  }\n\n  .row{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}\n  .field{display:flex; flex-direction:column; gap:6px;}\n  .field label{font-size:12px; color:var(--ink); font-weight:700; letter-spacing:0.1px;}\n  .field .hint{font-size:10.5px; color:#7c8aa3; font-weight:600; line-height:1.4;}\n  .inputgroup{\n    display:flex; border:1.5px solid var(--line); border-radius:8px; overflow:hidden;\n    background:#fbfcfe; transition:border-color .15s, box-shadow .15s;\n  }\n  .inputgroup:focus-within{border-color:var(--teal); box-shadow:0 0 0 3px rgba(164,218,5,0.18);}\n  .inputgroup input{\n    border:none; padding:11px 12px; font-size:15px; width:100%; font-family:var(--mono); font-weight:700;\n    background:transparent; color:var(--ink);\n  }\n  .inputgroup input:focus{outline:none;}\n  .inputgroup select{\n    border:none; border-left:1.5px solid var(--line); background:#eef2f8;\n    font-size:12px; font-family:var(--mono); font-weight:700; color:var(--teal-deep); padding:0 30px 0 10px;\n    -webkit-appearance:none; appearance:none; cursor:pointer;\n    background-image:url(\"data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3e%3cpath fill='%23000b3d' d='M1 1l5 5 5-5'/%3e%3c/svg%3e\");\n    background-repeat:no-repeat; background-position:right 10px center; background-size:10px 7px;\n  }\n  .inputgroup select:disabled{cursor:default; opacity:0.85;}\n  .inputgroup select:focus{outline:none;}\n\n  .result{\n    background:linear-gradient(135deg, #000722 0%, var(--teal-deep) 100%);\n    color:#fff; border-radius:10px; padding:24px;\n    margin-bottom:18px;\n    border:1px solid #001a4d;\n    box-shadow:0 8px 24px rgba(0,11,61,0.28);\n    position:relative; overflow:hidden;\n  }\n  .result::after{\n    content:''; position:absolute; top:-40%; right:-15%; width:220px; height:220px;\n    background:radial-gradient(circle, rgba(164,218,5,0.22), transparent 70%);\n    pointer-events:none;\n  }\n  .result .big-label{font-family:var(--mono); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; opacity:0.85; margin-bottom:8px; position:relative;}\n  .big-value{font-size:42px; font-weight:800; font-family:var(--mono); line-height:1.1; color:var(--teal); position:relative; text-shadow:0 0 24px rgba(164,218,5,0.35);}\n  .big-value span{font-size:16px; font-weight:700; opacity:0.85; color:#fff;}\n  .result-sub{font-size:12.5px; opacity:0.92; margin-top:12px; line-height:1.55; position:relative; max-width:520px;}\n\n  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}\n  .stat{\n    background:var(--panel); border:1px solid var(--line); border-top:3px solid var(--teal);\n    border-radius:8px; padding:13px; text-align:left;\n    box-shadow:0 2px 8px rgba(0,11,61,0.05);\n    transition:transform .15s;\n  }\n  .stat .k{font-size:10px; color:#7c8aa3; text-transform:uppercase; letter-spacing:0.5px; font-family:var(--mono); font-weight:700;}\n  .stat .v{font-size:18px; font-weight:800; color:var(--teal-deep); font-family:var(--mono); margin-top:4px;}\n  .stat .u{font-size:10.5px; color:#7c8aa3; font-weight:700;}\n\n  .formula{\n    font-family:var(--mono); font-size:11.5px; color:#3b4a63;\n    background:#f2f5fa; border:1px dashed var(--line); border-radius:8px;\n    padding:14px 16px; line-height:1.8; margin-top:4px;\n  }\n  .formula b{color:var(--teal-deep);}\n\n  .warn{font-size:11.5px; color:var(--amber); margin-top:10px; font-weight:700; padding:8px 10px; background:rgba(192,122,30,0.08); border-radius:6px; border-left:3px solid var(--amber);}\n  .strength-display{\n    font-family:var(--mono); font-size:24px; font-weight:800; color:var(--teal-deep);\n    background:#eef2f8; border:1.5px solid var(--line); border-radius:8px;\n    padding:11px 16px; display:inline-block; min-width:120px;\n  }\n  footer{text-align:center; font-size:11px; color:#7c8aa3; margin-top:28px; font-family:var(--mono); font-weight:600; line-height:1.6;}\n  #alumAddedCustom, #tankVolumeCustom, #doseCustom{\n    margin-top:6px; border:1.5px solid var(--line); border-radius:8px; padding:10px 12px;\n    font-family:var(--mono); font-weight:700; font-size:14px; color:var(--ink);\n    background:#fbfcfe; transition:border-color .15s, box-shadow .15s;\n    width:100%; box-sizing:border-box; display:block;\n  }\n  #alumAddedCustom:focus, #tankVolumeCustom:focus, #doseCustom:focus{\n    outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(164,218,5,0.18);\n  }\n\n  @media (max-width:600px){\n    body{padding:14px 6px 32px;}\n    .wrap{max-width:100%;}\n    .head{padding:12px 14px; border-radius:8px;}\n    .panel{padding:14px 14px; border-radius:8px; margin-bottom:12px;}\n    .result{padding:18px 16px; border-radius:8px;}\n    .row{grid-template-columns:1fr; gap:10px; margin-bottom:10px;}\n    .grid3{grid-template-columns:1fr 1fr; gap:8px;}\n    .chem-toggle{gap:6px;}\n    .chem-btn{flex:1 1 calc(50% - 3px); min-width:0; font-size:11.5px; padding:10px 4px;}\n    .head h1{font-size:15px;}\n    .project-name{font-size:10.5px;}\n    .brand{gap:8px;}\n    .brand svg{width:34px; height:34px;}\n    .big-value{font-size:30px;}\n    .stat{padding:10px;}\n    .stat .v{font-size:14.5px;}\n    .subtitle{font-size:11px;}\n  }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n\n  <div class=\"head\">\n    <div class=\"brand\">\n      <svg width=\"42\" height=\"42\" viewBox=\"0 0 42 42\" xmlns=\"http://www.w3.org/2000/svg\">\n        <circle cx=\"21\" cy=\"21\" r=\"20\" fill=\"none\" stroke=\"#a4da05\" stroke-width=\"2\"/>\n        <path d=\"M21 8 C21 8 12 20 12 26.5 C12 31.7 16.03 35 21 35 C25.97 35 30 31.7 30 26.5 C30 20 21 8 21 8 Z\" fill=\"#a4da05\"/>\n        <path d=\"M21 14 C21 14 16 22 16 26.5 C16 29.5 18.2 31.5 21 31.5\" fill=\"none\" stroke=\"#000b3d\" stroke-width=\"1.6\" stroke-linecap=\"round\" opacity=\"0.75\"/>\n      </svg>\n      <div class=\"brand-text\">\n        <h1>SUEZ Water Treatment Plant</h1>\n        <div class=\"project-name\">Puttur Project</div>\n      </div>\n    </div>\n    <div class=\"tag\">WTP \u00b7 ppm \u2192 sec/L</div>\n  </div>\n  <div class=\"subtitle\">// alum &amp; lime feed-rate + stopwatch calibration for gravity/pump dosing</div>\n\n  <div class=\"panel\">\n    <div class=\"panel-label\">Chemical</div>\n    <div class=\"chem-toggle\">\n      <div class=\"chem-btn active\" data-chem=\"alum\" data-strength=\"1\">Alum</div>\n      <div class=\"chem-btn\" data-chem=\"lime\" data-strength=\"5\">Lime</div>\n      <div class=\"chem-btn\" data-chem=\"polyelectrolyte\" data-strength=\"0.1\">Polyelectrolyte</div>\n      <div class=\"chem-btn\" data-chem=\"custom\" data-strength=\"\">Custom</div>\n    </div>\n\n    <div class=\"row\">\n      <div class=\"field\">\n        <label id=\"flowLabel\">Raw Water Flow</label>\n        <div class=\"inputgroup\">\n          <input type=\"number\" id=\"flow\" value=\"370\" min=\"0\" step=\"any\">\n          <select id=\"flowUnit\">\n            <option value=\"m3h\" selected>m\u00b3/hr</option>\n            <option value=\"LPH\">L/hr</option>\n            <option value=\"LPM\">L/min</option>\n            <option value=\"MLD\">MLD</option>\n          </select>\n        </div>\n        <span class=\"hint\">plant intake flow rate</span>\n      </div>\n      <div class=\"field\">\n        <label>Required Dose</label>\n        <div class=\"inputgroup\">\n          <select id=\"dose\">\n            <option value=\"2\">2</option>\n            <option value=\"3\">3</option>\n            <option value=\"4\">4</option>\n            <option value=\"5\">5</option>\n            <option value=\"6\">6</option>\n            <option value=\"7\">7</option>\n            <option value=\"8\">8</option>\n            <option value=\"9\">9</option>\n            <option value=\"10\" selected>10</option>\n            <option value=\"11\">11</option>\n            <option value=\"12\">12</option>\n            <option value=\"13\">13</option>\n            <option value=\"14\">14</option>\n            <option value=\"15\">15</option>\n            <option value=\"16\">16</option>\n            <option value=\"17\">17</option>\n            <option value=\"18\">18</option>\n            <option value=\"19\">19</option>\n            <option value=\"20\">20</option>\n            <option value=\"21\">21</option>\n            <option value=\"22\">22</option>\n            <option value=\"23\">23</option>\n            <option value=\"24\">24</option>\n            <option value=\"25\">25</option>\n            <option value=\"26\">26</option>\n            <option value=\"27\">27</option>\n            <option value=\"28\">28</option>\n            <option value=\"29\">29</option>\n            <option value=\"30\">30</option>\n            <option value=\"custom\">Custom\u2026</option>\n          </select>\n          <select disabled style=\"color:#8a9997;\">\n            <option>PPM</option>\n          </select>\n        </div>\n        <input type=\"number\" id=\"doseCustom\" placeholder=\"Enter ppm\" min=\"0\" step=\"any\" style=\"display:none;\">\n        <span class=\"hint\">1 ppm = 1 mg/L</span>\n      </div>\n    </div>\n\n    <div class=\"row\">\n      <div class=\"field\">\n        <label>Chemical Added</label>\n        <div class=\"inputgroup\">\n          <select id=\"alumAddedSelect\">\n            <option value=\"5\">5</option>\n            <option value=\"10\">10</option>\n            <option value=\"15\">15</option>\n            <option value=\"20\">20</option>\n            <option value=\"22\">22</option>\n            <option value=\"44\">44</option>\n            <option value=\"66\">66</option>\n            <option value=\"88\">88</option>\n            <option value=\"110\">110</option>\n            <option value=\"custom\">Custom\u2026</option>\n          </select>\n          <select disabled style=\"color:#8a9997;\">\n            <option>kg</option>\n          </select>\n        </div>\n        <input type=\"number\" id=\"alumAddedCustom\" placeholder=\"Enter kg\" min=\"0.001\" step=\"any\" style=\"display:none;\">\n        <span class=\"hint\">alum / lime / polyelectrolyte dissolved into the tank</span>\n      </div>\n      <div class=\"field\">\n        <label>Tank Volume</label>\n        <div class=\"inputgroup\">\n          <select id=\"tankVolumeSelect\">\n            <option value=\"500\">500</option>\n            <option value=\"1000\">1000</option>\n            <option value=\"1500\">1500</option>\n            <option value=\"1800\">1800</option>\n            <option value=\"2000\">2000</option>\n            <option value=\"2150\">2150</option>\n            <option value=\"2700\">2700</option>\n            <option value=\"4000\">4000</option>\n            <option value=\"6000\">6000</option>\n            <option value=\"8000\">8000</option>\n            <option value=\"custom\">Custom\u2026</option>\n          </select>\n          <select disabled style=\"color:#8a9997;\">\n            <option>L</option>\n          </select>\n        </div>\n        <input type=\"number\" id=\"tankVolumeCustom\" placeholder=\"Enter litres\" min=\"0.001\" step=\"any\" style=\"display:none;\">\n        <span class=\"hint\">total mixed solution volume</span>\n      </div>\n    </div>\n\n    <div class=\"row\" style=\"grid-template-columns:1fr; margin-bottom:0;\">\n      <div class=\"field\">\n        <label>Solution Strength <span style=\"font-weight:600;color:#8a9997;\">(auto-calculated)</span></label>\n        <div class=\"strength-display\" id=\"strengthDisplay\">\u2014 %</div>\n        <span class=\"hint\" id=\"strengthHint\">Strength = Alum added (kg) \u00f7 Tank volume (L) \u00d7 100</span>\n      </div>\n    </div>\n  </div>\n\n  <div class=\"result\">\n    <div class=\"big-label\">Stopwatch calibration</div>\n    <div class=\"big-value\" id=\"secPerL\">\u2014 <span>sec / litre</span></div>\n    <div class=\"result-sub\" id=\"resultSub\">Time the dosing outlet \u2014 it should fill a 1 L jar in this many seconds to hit the target dose.</div>\n  </div>\n\n  <div class=\"grid3\">\n    <div class=\"stat\">\n      <div class=\"k\">Chemical needed</div>\n      <div class=\"v\" id=\"kgDay\">\u2014</div>\n      <div class=\"u\">kg / day</div>\n    </div>\n    <div class=\"stat\">\n      <div class=\"k\">Solution feed</div>\n      <div class=\"v\" id=\"lHr\">\u2014</div>\n      <div class=\"u\">L / hr</div>\n    </div>\n    <div class=\"stat\">\n      <div class=\"k\">Tank backup</div>\n      <div class=\"v\" id=\"backupHrs\">\u2014</div>\n      <div class=\"u\">hours till empty</div>\n    </div>\n  </div>\n\n  <div class=\"panel\" style=\"margin-top:18px;\">\n    <div class=\"panel-label\">How it's worked out</div>\n    <div class=\"formula\">\n      <b>Solution strength</b> (%) = Chemical added (kg) \u00f7 Tank volume (L) \u00d7 100<br>\n      <b>Chemical dose</b> (kg/day) = Flow (L/hr) \u00d7 24 \u00d7 Dose (mg/L) \u00f7 1,000,000<br>\n      <b>Solution feed</b> (L/hr) = Chemical dose (kg/day) \u00f7 24 \u00f7 Strength(%) \u00d7 100<br>\n      <b>Calibration</b> (sec per litre) = 3600 \u00f7 Solution feed (L/hr)<br>\n      <b>Tank backup</b> (hours) = Tank volume (L) \u00f7 Solution feed (L/hr)\n    </div>\n    <div class=\"warn\" id=\"edgeWarn\" style=\"display:none;\"></div>\n  </div>\n\n  <footer>\n    Verify against a jar test before applying to live dosing \u2014 strength &amp; purity of mixed solution affects actual dose.\n    <div style=\"margin-top:8px; letter-spacing:0.4px; opacity:0.8;\">Designed by Mohamed Azarudeen</div>\n  </footer>\n</div>\n\n<script>\nconst $ = id => document.getElementById(id);\nlet strengthOverridden = false;\n\nconst doseOptionsDefault = Array.from({length:29}, (_,i)=>i+2); // 2..30\nconst doseOptionsPoly = Array.from({length:20}, (_,i)=>i+1); // 1..20\nconst alumOptionsDefault = [5,10,15,20,22,44,66,88,110];\nconst alumOptionsPoly = Array.from({length:20}, (_,i)=>i+1); // 1..20\n\nfunction rebuildOptions(selectId, values, defaultValue){\n  const sel = $(selectId);\n  const prev = sel.value;\n  sel.innerHTML = '';\n  values.forEach(v=>{\n    const opt = document.createElement('option');\n    opt.value = v; opt.textContent = v;\n    sel.appendChild(opt);\n  });\n  const customOpt = document.createElement('option');\n  customOpt.value = 'custom'; customOpt.textContent = 'Custom\u2026';\n  sel.appendChild(customOpt);\n\n  if(values.map(String).includes(prev) || prev === 'custom'){\n    sel.value = prev;\n  } else {\n    sel.value = String(defaultValue);\n  }\n}\n\ndocument.querySelectorAll('.chem-btn').forEach(btn=>{\n  btn.addEventListener('click', ()=>{\n    document.querySelectorAll('.chem-btn').forEach(b=>b.classList.remove('active'));\n    btn.classList.add('active');\n\n    const isPoly = btn.dataset.chem === 'polyelectrolyte';\n    $('flowLabel').textContent = isPoly ? 'Feed Flow' : 'Raw Water Flow';\n    $('flow').value = isPoly ? 41 : 370;\n    rebuildOptions('dose', isPoly ? doseOptionsPoly : doseOptionsDefault, isPoly ? 5 : 10);\n    rebuildOptions('alumAddedSelect', isPoly ? alumOptionsPoly : alumOptionsDefault, isPoly ? 5 : 22);\n    if($('dose').value !== 'custom') $('doseCustom').style.display = 'none';\n    if($('alumAddedSelect').value !== 'custom') $('alumAddedCustom').style.display = 'none';\n\n    const s = parseFloat(btn.dataset.strength);\n    if(!isNaN(s)){\n      // suggest an alum-added value for the current tank volume at typical strength\n      const tank = getTankVolume() || 100;\n      const suggested = (s * tank / 100);\n      $('alumAddedSelect').value = 'custom';\n      $('alumAddedCustom').style.display = '';\n      $('alumAddedCustom').value = suggested.toFixed(3).replace(/\\.?0+$/,'');\n    }\n    const hint = $('strengthHint');\n    if(btn.dataset.chem === 'alum'){\n      hint.textContent = 'typical alum stock: 1\u20135% w/v \u2014 enter kg dissolved and tank volume below';\n    } else if(btn.dataset.chem === 'lime'){\n      hint.textContent = 'typical lime slurry: 5\u201310% w/v \u2014 stir continuously, lime settles fast';\n    } else if(btn.dataset.chem === 'polyelectrolyte'){\n      hint.textContent = 'typical polyelectrolyte stock: 0.05\u20130.2% w/v \u2014 mix well in advance, needs maturation time';\n    } else {\n      hint.textContent = 'Strength = Chemical added (kg) \u00f7 Tank volume (L) \u00d7 100';\n    }\n    calc();\n  });\n});\n\nfunction wireDropdownWithCustom(selectId, customId){\n  const sel = $(selectId), custom = $(customId);\n  sel.addEventListener('change', ()=>{\n    if(sel.value === 'custom'){\n      custom.style.display = '';\n      custom.focus();\n    } else {\n      custom.style.display = 'none';\n    }\n    calc();\n  });\n  custom.addEventListener('input', calc);\n}\nwireDropdownWithCustom('alumAddedSelect', 'alumAddedCustom');\nwireDropdownWithCustom('tankVolumeSelect', 'tankVolumeCustom');\nwireDropdownWithCustom('dose', 'doseCustom');\n\nfunction getAlumAdded(){\n  const sel = $('alumAddedSelect');\n  if(sel.value === 'custom') return parseFloat($('alumAddedCustom').value) || 0;\n  return parseFloat(sel.value) || 0;\n}\nfunction getTankVolume(){\n  const sel = $('tankVolumeSelect');\n  if(sel.value === 'custom') return parseFloat($('tankVolumeCustom').value) || 0;\n  return parseFloat(sel.value) || 0;\n}\nfunction getDose(){\n  const sel = $('dose');\n  if(sel.value === 'custom') return parseFloat($('doseCustom').value) || 0;\n  return parseFloat(sel.value) || 0;\n}\n\nfunction fmtNum(num){\n  if(!isFinite(num) || num === 0) return '0';\n  const decimals = num >= 1 ? 2 : num >= 0.1 ? 3 : 4;\n  let s = num.toFixed(decimals);\n  s = s.replace(/(\\.\\d*?)0+$/,'$1').replace(/\\.$/,'');\n  return s;\n}\n\nfunction toLPH(val, unit){\n  val = parseFloat(val) || 0;\n  switch(unit){\n    case 'LPH': return val;\n    case 'LPM': return val * 60;\n    case 'MLD': return val * 1000000 / 24;\n    case 'm3h': return val * 1000;\n    default: return val;\n  }\n}\n\nfunction calc(){\n  const flowRaw = $('flow').value;\n  const flowUnit = $('flowUnit').value;\n  const dose = getDose();\n  const alumAdded = getAlumAdded();\n  const tankVolume = getTankVolume();\n  const strength = (alumAdded > 0 && tankVolume > 0) ? (alumAdded / tankVolume) * 100 : 0;\n\n  $('strengthDisplay').textContent = strength > 0 ? fmtNum(strength) + ' %' : '\u2014 %';\n\n  const flowLPH = toLPH(flowRaw, flowUnit);\n\n  const warnEl = $('edgeWarn');\n  warnEl.style.display = 'none';\n\n  if(flowLPH <= 0 || dose <= 0 || strength <= 0){\n    $('secPerL').innerHTML = '\u2014 <span>sec / litre</span>';\n    $('kgDay').textContent = '\u2014';\n    $('lHr').textContent = '\u2014';\n    $('backupHrs').textContent = '\u2014';\n    return;\n  }\n\n  const kgPerDay = (flowLPH * 24 * dose) / 1000000;\n  const lPerHr = (kgPerDay / 24) / strength * 100;\n  const backupHours = tankVolume / lPerHr;\n  const secPerL = 3600 / lPerHr;\n\n  $('kgDay').textContent = fmtNum(kgPerDay);\n  $('lHr').textContent = fmtNum(lPerHr);\n  $('backupHrs').textContent = fmtNum(backupHours);\n\n  if(secPerL < 2){\n    $('secPerL').innerHTML = fmtNum(secPerL) + ' <span>sec / litre</span>';\n    warnEl.style.display = 'block';\n    warnEl.textContent = '\u26a0 Feed rate is very fast \u2014 consider timing 5 L or 10 L instead of 1 L for an accurate stopwatch reading.';\n  } else if(secPerL > 36000){\n    $('secPerL').innerHTML = fmtNum(secPerL/3600) + ' <span>hr / litre</span>';\n    warnEl.style.display = 'block';\n    warnEl.textContent = '\u26a0 Feed rate is very slow \u2014 consider timing how much collects in 10\u201315 minutes instead.';\n  } else {\n    $('secPerL').innerHTML = fmtNum(secPerL) + ' <span>sec / litre</span>';\n  }\n\n  $('resultSub').textContent = `At ${dose} ppm on ${flowRaw} ${labelUnit(flowUnit)} flow, using a ${fmtNum(strength)}% stock solution: the dosing outlet should fill a 1 L jar in about ${fmtNum(secPerL)} seconds.`;\n}\n\nfunction labelUnit(u){\n  return {LPH:'L/hr', LPM:'L/min', MLD:'MLD', m3h:'m\u00b3/hr'}[u] || u;\n}\n\n['flow','flowUnit','dose'].forEach(id=>{\n  $(id).addEventListener('input', calc);\n  $(id).addEventListener('change', calc);\n});\n\ncalc();\n<\/script>\n</body>\n</html>\n";
