<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Operator Tools</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2160C4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Operator Tools">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<style>
  :root{
    --bg:#F5F4F0; --panel:#FFFFFF; --line:#D8D6CE; --text:#22262A; --text-dim:#5B6067;
    --amber:#E0870B; --amber-dim:#FEF0D9; --steel:#2160C4; --steel-dim:#E3EDFC;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; margin:0; background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  .shell{ display:flex; flex-direction:column; height:100%; }
  .tabbar{
    display:flex; gap:8px; padding:10px 12px; background:var(--panel);
    border-bottom:2px solid var(--line); flex-shrink:0; -webkit-overflow-scrolling:touch;
    overflow-x:auto; white-space:nowrap;
    padding-top:calc(10px + env(safe-area-inset-top));
  }
  .tabbtn{
    flex:none; border:1.5px solid var(--line); background:var(--bg); color:var(--text-dim);
    font-weight:700; font-size:13px; padding:9px 16px; border-radius:8px; cursor:pointer;
    transition:all .15s ease;
  }
  .tabbtn:hover{ border-color:var(--steel); color:var(--steel); }
  .tabbtn.active{ background:var(--steel); border-color:var(--steel); color:#fff; box-shadow:0 2px 8px rgba(33,96,196,0.3); }
  .frames{ flex:1; min-height:0; position:relative; }
  iframe{
    position:absolute; top:0; left:0; width:100%; height:100%; border:none;
    background:var(--bg); display:none;
  }
  iframe.active{ display:block; }
  .forms-pane{
    position:absolute; top:0; left:0; width:100%; height:100%; overflow:auto;
    display:none; align-items:center; justify-content:center; background:var(--bg);
  }
  .forms-pane.active{ display:flex; }
  .forms-card{
    background:#ffffff; padding:40px 36px; border-radius:14px;
    box-shadow:0 4px 20px rgba(0,0,0,0.08); text-align:center; width:auto;
  }
  .forms-card h1{ font-size:20px; color:#1f2937; margin:0 0 24px 0; font-family:inherit; }
  .forms-btn-row{ display:flex; flex-direction:row; flex-wrap:nowrap; gap:14px; }
  a.forms-btn{
    display:inline-block; text-decoration:none; background:#2563eb; color:#ffffff;
    font-size:15px; font-weight:600; padding:14px 16px; border-radius:8px;
    white-space:nowrap; flex:0 0 auto; transition:background 0.2s ease;
  }
  a.forms-btn:hover{ background:#1d4ed8; }
  a.forms-btn.secondary{ background:#16a34a; }
  a.forms-btn.secondary:hover{ background:#15803d; }
</style>
</head>
<body>
<div class="shell">
  <div class="tabbar">
    <button class="tabbtn active" id="btnLab" onclick="showTool('lab')">Lab Micro Entry</button>
    <button class="tabbtn" id="btnCentri" onclick="showTool('centri')">Centrifuge</button>
    <button class="tabbtn" id="btnChem" onclick="showTool('chem')">Chemical Cal</button>
    <button class="tabbtn" id="btnForms" onclick="showTool('forms')">Data Collection Forms</button>
  </div>
  <div class="frames">
    <iframe id="frameLab" class="active"></iframe>
    <iframe id="frameCentri"></iframe>
    <iframe id="frameChem"></iframe>
    <div class="forms-pane" id="paneForms">
      <div class="forms-card">
        <h1>Data Collection Forms</h1>
        <div class="forms-btn-row">
          <a class="forms-btn" href="https://forms.cloud.microsoft/e/8fZe599e83" target="_blank" rel="noopener noreferrer">History Card Entry</a>
          <a class="forms-btn secondary" href="https://forms.cloud.microsoft/e/HNFWdg49ik" target="_blank" rel="noopener noreferrer">Lab Report</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  var LAB_HTML = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Microbiological Test Report \u2014 Entry System</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js\"><\/script>\n<style>\n  :root{\n    --bg:#F5F8F7;\n    --surface:#FFFFFF;\n    --ink:#10262B;\n    --ink-soft:#4C6469;\n    --primary:#0E7C86;\n    --primary-dark:#0A5B62;\n    --amber:#E29A3C;\n    --border:#DBE5E3;\n    --success:#2F9E5B;\n    --danger:#C1443C;\n    --danger-bg:#FBEAE8;\n  }\n  *{box-sizing:border-box;}\n  html,body{margin:0;padding:0;}\n  body{\n    background:var(--bg);\n    color:var(--ink);\n    font-family:'Inter',sans-serif;\n    -webkit-font-smoothing:antialiased;\n    min-height:100vh;\n  }\n  .app{max-width:980px;margin:0 auto;padding:28px 20px 100px;}\n\n  /* ---- Top bar ---- */\n  .topbar{\n    display:flex;align-items:center;justify-content:space-between;\n    margin-bottom:22px;flex-wrap:wrap;gap:14px;\n  }\n  .brand{display:flex;align-items:center;gap:12px;}\n  .brand-mark{\n    width:40px;height:40px;flex:none;\n    border-radius:9px;\n    background:linear-gradient(160deg,var(--primary),var(--primary-dark));\n    display:flex;align-items:center;justify-content:center;\n  }\n  .brand-mark svg{width:22px;height:22px;}\n  .brand h1{\n    font-family:'Space Grotesk',sans-serif;\n    font-size:18px;font-weight:700;margin:0;letter-spacing:.2px;\n  }\n  .brand p{margin:1px 0 0;font-size:12.5px;color:var(--ink-soft);}\n\n  .tabs{display:flex;gap:6px;background:var(--surface);padding:4px;border-radius:10px;border:1px solid var(--border);}\n  .tab-btn{\n    border:none;background:transparent;padding:9px 16px;border-radius:7px;\n    font-family:'Inter';font-size:13.5px;font-weight:600;color:var(--ink-soft);\n    cursor:pointer;transition:all .15s ease;\n  }\n  .tab-btn.active{background:var(--primary);color:#fff;}\n  .tab-btn:not(.active):hover{background:var(--bg);color:var(--ink);}\n\n  /* ---- Card ---- */\n  .card{\n    background:var(--surface);border:1px solid var(--border);border-radius:14px;\n    padding:26px 26px 22px;margin-bottom:20px;\n    box-shadow:0 1px 2px rgba(16,38,43,.04);\n  }\n  .card h2{\n    font-family:'Space Grotesk',sans-serif;font-size:15.5px;font-weight:600;\n    margin:0 0 18px;display:flex;align-items:center;gap:9px;color:var(--primary-dark);\n  }\n  .card h2 .num{\n    font-family:'IBM Plex Mono';font-size:11px;background:var(--bg);\n    border:1px solid var(--border);color:var(--ink-soft);\n    padding:2px 7px;border-radius:20px;\n  }\n\n  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}\n  .grid.g4{grid-template-columns:repeat(4,1fr);}\n  @media(max-width:700px){.grid,.grid.g4{grid-template-columns:1fr;}}\n\n  .field label{\n    display:block;font-size:12px;font-weight:600;color:var(--ink-soft);\n    margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;\n  }\n  .field label .req{color:var(--danger);}\n  .field input, .field select, .field textarea{\n    width:100%;border:2px solid var(--border);border-radius:8px;\n    padding:10px 12px;font-family:'Inter';font-size:14px;color:var(--ink);\n    background:#fff;transition:border-color .15s;\n  }\n  .field input:focus, .field select:focus, .field textarea:focus{\n    outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(14,124,134,.12);\n  }\n  .field textarea{resize:vertical;min-height:56px;font-family:'Inter';}\n  .readonly-field{background:var(--bg);color:var(--ink-soft);font-family:'IBM Plex Mono';font-weight:600;cursor:not-allowed;}\n  .field{margin-bottom:0;}\n  .full{grid-column:1/-1;}\n\n  /* ---- Sample rows ---- */\n  .sample-row{\n    border:2px solid var(--border);border-radius:10px;padding:14px 14px 6px;\n    margin-bottom:12px;background:#FBFDFC;position:relative;\n  }\n  .sample-row .row-head{\n    display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;\n  }\n  .row-head span{\n    font-family:'IBM Plex Mono';font-size:12px;color:var(--primary-dark);font-weight:600;\n  }\n  .icon-btn{\n    border:none;background:transparent;cursor:pointer;color:var(--ink-soft);\n    padding:4px;border-radius:6px;display:flex;align-items:center;\n  }\n  .icon-btn:hover{background:var(--danger-bg);color:var(--danger);}\n  .icon-btn svg{width:16px;height:16px;}\n  .sample-grid{display:grid;grid-template-columns:1fr 1.6fr 1fr 1fr;gap:12px;margin-bottom:12px;}\n  @media(max-width:700px){.sample-grid{grid-template-columns:1fr 1fr;}}\n\n  .sample-head-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}\n  .input-with-btn{display:flex;gap:8px;}\n  .input-with-btn input{flex:1;}\n  .mini-reset-btn{\n    flex:none;border:1px solid var(--border);background:#fff;color:var(--ink-soft);\n    font-size:12px;font-weight:600;padding:0 12px;border-radius:8px;cursor:pointer;\n  }\n  .mini-reset-btn:hover{border-color:var(--primary);color:var(--primary-dark);}\n  .add-row-icon-btn{\n    display:flex;align-items:center;gap:6px;background:var(--primary);color:#fff;\n    border:none;font-weight:600;font-size:12.5px;padding:7px 12px 7px 9px;\n    border-radius:20px;cursor:pointer;transition:all .15s;\n  }\n  .add-row-icon-btn svg{width:13px;height:13px;}\n  .add-row-icon-btn:hover{background:var(--primary-dark);box-shadow:0 2px 8px rgba(14,124,134,.25);}\n  .tag-req, .tag-opt{\n    font-style:normal;font-family:'IBM Plex Mono';font-size:9.5px;font-weight:600;\n    padding:2px 7px;border-radius:20px;margin-left:8px;text-transform:uppercase;letter-spacing:.03em;\n  }\n  .tag-req{background:var(--danger-bg);color:var(--danger);}\n  .tag-opt{background:var(--bg);color:var(--ink-soft);border:1px solid var(--border);}\n\n  /* ---- Buttons ---- */\n  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}\n  .btn{\n    font-family:'Inter';font-weight:600;font-size:14px;padding:11px 18px;\n    border-radius:9px;border:1px solid transparent;cursor:pointer;\n    display:inline-flex;align-items:center;gap:8px;transition:all .15s;\n  }\n  .btn svg{width:16px;height:16px;}\n  .btn-primary{background:var(--primary);color:#fff;}\n  .btn-primary:hover{background:var(--primary-dark);}\n  .btn-ghost{background:#fff;color:var(--ink);border-color:var(--border);}\n  .btn-ghost:hover{border-color:var(--primary);color:var(--primary-dark);}\n  .btn-success{background:var(--success);color:#fff;}\n  .btn-success:hover{filter:brightness(0.93);}\n  .btn-outline-danger{background:#fff;color:var(--danger);border-color:#EFC9C4;}\n  .btn-outline-danger:hover{background:var(--danger-bg);}\n  .btn:disabled{opacity:.5;cursor:not-allowed;}\n\n  .helper{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}\n  .error-text{color:var(--danger);font-size:12.5px;margin-top:10px;font-weight:500;}\n\n  /* ---- Preview / stamp ---- */\n  .stamp{\n    position:absolute;top:20px;right:20px;\n    font-family:'IBM Plex Mono';font-size:11px;font-weight:600;letter-spacing:.14em;\n    border:2px dashed var(--amber);color:var(--amber);\n    padding:6px 14px;border-radius:6px;transform:rotate(4deg);\n    text-transform:uppercase;background:#FFFBF3;\n  }\n  .stamp.saved{border-color:var(--success);color:var(--success);background:#F1FBF5;transform:rotate(-3deg);}\n\n  .preview-wrap{position:relative;display:flex;justify-content:center;background:transparent;border:none;box-shadow:none;padding:18px 0 20px;}\n  .preview-header{\n    text-align:center;border:1px solid var(--ink);padding:16px;border-radius:6px 6px 0 0;\n    border-bottom:none;\n  }\n  .preview-header h3{\n    font-family:'Space Grotesk';font-size:15px;margin:0 0 4px;line-height:1.4;text-transform:uppercase;\n  }\n  .preview-header .sub{font-size:16px;font-weight:700;font-family:'Space Grotesk';margin-top:8px;}\n  table.doc-table{width:100%;border-collapse:collapse;font-size:13px;}\n  table.doc-table th, table.doc-table td{\n    border:1px solid var(--ink);padding:9px 10px;text-align:left;vertical-align:top;\n  }\n  table.doc-table th{background:var(--bg);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}\n  table.doc-table td.mono, table.doc-table th.mono{font-family:'IBM Plex Mono';}\n  .meta-table td{font-size:13px;}\n  .meta-table td.label{font-weight:600;color:var(--ink-soft);width:38%;}\n  .footer-sign{display:flex;justify-content:space-between;padding:22px 6px 6px;font-size:13px;}\n  .footer-sign div{border-top:1px solid var(--ink);padding-top:6px;min-width:160px;text-align:center;}\n\n  /* ---- Saved list ---- */\n  .list-table-wrap{overflow-x:auto;}\n  table.list-table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:680px;}\n  table.list-table th{\n    text-align:left;font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;\n    letter-spacing:.04em;padding:8px 10px;border-bottom:1.5px solid var(--border);\n  }\n  table.list-table td{padding:12px 10px;border-bottom:1px solid var(--border);}\n  table.list-table tr:hover td{background:#FAFCFB;}\n  .pill{\n    font-family:'IBM Plex Mono';font-size:11.5px;background:var(--bg);\n    border:1px solid var(--border);padding:3px 9px;border-radius:20px;color:var(--primary-dark);\n  }\n  .row-actions{display:flex;gap:6px;}\n  .row-actions button{\n    border:1px solid var(--border);background:#fff;border-radius:7px;padding:6px 8px;\n    cursor:pointer;color:var(--ink-soft);display:flex;\n  }\n  .row-actions button:hover{border-color:var(--primary);color:var(--primary-dark);}\n  .row-actions button.del:hover{border-color:#EFC9C4;color:var(--danger);background:var(--danger-bg);}\n  .row-actions svg{width:15px;height:15px;}\n\n  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}\n  .empty-state svg{width:44px;height:44px;margin-bottom:12px;opacity:.5;}\n\n  .toast{\n    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);\n    background:var(--ink);color:#fff;padding:12px 20px;border-radius:9px;\n    font-size:13.5px;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.18);\n    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:50;\n  }\n  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}\n\n  .export-panel{display:flex;gap:10px;flex-wrap:wrap;}\n\n  .email-block{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}\n  .email-block-label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em;}\n  .email-checks{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:14px;}\n  .email-check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;font-weight:500;}\n  .email-check input{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;}\n  .email-check em{display:block;font-style:normal;font-family:'IBM Plex Mono';font-size:11px;color:var(--ink-soft);}\n\n  .badge-count{font-family:'IBM Plex Mono';font-size:11px;background:var(--primary);color:#fff;border-radius:20px;padding:2px 8px;margin-left:6px;}\n\n  .img-preview{position:relative;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg);}\n  .img-preview img{width:100%;height:130px;object-fit:cover;display:block;}\n  .img-preview .img-remove{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.92);border:1px solid var(--border);}\n\n  .dropzone{\n    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;\n    border:2.5px dashed var(--primary);border-radius:10px;background:#EFF7F6;\n    height:130px;cursor:pointer;transition:all .15s;text-align:center;padding:10px;\n  }\n  .dropzone:hover{background:#E1F1EF;border-color:var(--primary-dark);}\n  .dropzone svg{width:22px;height:22px;color:var(--primary-dark);}\n  .dropzone span{font-size:12px;font-weight:600;color:var(--primary-dark);}\n  .dropzone input[type=\"file\"]{display:none;}\n\n  /* ---- Exact-format document preview ---- */\n  .doc-sheet{\n    position:relative;display:flex;flex-direction:column;\n    border:5px solid #111;border-radius:0;background:#fff;padding:0;\n    max-width:794px;width:100%;margin:0 auto;min-height:1123px;\n    font-weight:600;\n    box-shadow:0 4px 20px rgba(16,38,43,.10);\n  }\n  .doc-spacer{flex:1 1 auto;min-height:16px;}\n  .doc-qty-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:2px solid #111;background:var(--bg);gap:12px;flex-wrap:wrap;}\n  .doc-report-name{font-family:'Space Grotesk';font-weight:700;font-size:15px;color:var(--primary-dark);}\n  .doc-qty-value{font-size:14px;font-weight:700;white-space:nowrap;}\n  .doc-title-box{border-bottom:2px solid #111;padding:22px 18px;text-align:center;background:#fff;}\n  .doc-title-box h3{font-family:'Inter';font-weight:700;font-size:18px;margin:0;line-height:1.5;text-transform:uppercase;}\n  .doc-sub{text-align:center;font-family:'Space Grotesk';font-weight:700;font-size:22px;padding:17px 0;border-bottom:2px solid #111;}\n  .doc-meta-row{display:flex;border-bottom:3px solid #111;}\n  .doc-meta-left{flex:1;border-right:3px solid #111;}\n  .doc-meta-left table{width:100%;border-collapse:collapse;}\n  .doc-meta-left th, .doc-meta-left td{padding:13px 12px;font-size:15px;border-bottom:2px solid #111;text-align:left;}\n  .doc-meta-left th{background:var(--bg);font-weight:700;text-transform:uppercase;font-size:12px;}\n  .doc-meta-left tr:last-child td{border-bottom:none;}\n  .doc-meta-right{flex:1;}\n  .doc-meta-right table{width:100%;height:100%;border-collapse:collapse;}\n  .doc-meta-right td{padding:13px 14px;font-size:15px;border-bottom:2px solid #111;}\n  .doc-meta-right tr:last-child td{border-bottom:none;}\n  .doc-meta-right td.k{color:var(--ink-soft);text-align:right;width:45%;font-weight:700;}\n  .doc-meta-right td.v{font-family:'IBM Plex Mono';font-weight:700;}\n\n  table.doc-results{width:100%;border-collapse:collapse;font-size:15px;}\n  table.doc-results th, table.doc-results td{border:2px solid #111;padding:14px 12px;text-align:center;}\n  table.doc-results th{background:var(--bg);font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.03em;}\n  table.doc-results td.name-cell{text-align:left;}\n  .doc-kit-box{margin:14px 16px;border:2.5px solid #111;border-radius:0;}\n  .doc-kit-heading{text-align:center;font-weight:700;font-size:16px;text-transform:uppercase;padding:14px 0;border-bottom:2px solid #111;letter-spacing:.04em;}\n  .doc-kit-row{display:flex;}\n  .doc-kit-cell{flex:1;padding:22px;text-align:center;}\n  .doc-kit-cell:first-child{border-right:2px solid #111;}\n  .doc-kit-cell img{max-width:100%;max-height:340px;border-radius:4px;border:2px solid #111;object-fit:contain;}\n  .doc-kit-cell .cap{margin-top:14px;font-weight:700;font-size:14px;letter-spacing:.05em;}\n  .doc-kit-empty{color:var(--ink-soft);font-size:13px;font-style:italic;padding:40px 0;}\n  .doc-signoff{display:flex;justify-content:space-around;padding:32px 18px 16px;border-top:2px solid #111;}\n  .doc-signoff div{text-align:center;font-size:15px;font-weight:700;}\n  .doc-end{text-align:center;padding:14px 0 20px;font-size:13px;letter-spacing:.06em;color:var(--ink-soft);font-weight:600;}\n\n  /* ---- Sticky bottom action bar ---- */\n  #sticky-bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none;}\n  .sticky-inner{\n    pointer-events:auto;max-width:940px;width:calc(100% - 40px);margin:0 20px 18px;\n    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);\n    border:1px solid var(--border);border-radius:14px;\n    box-shadow:0 10px 30px rgba(16,38,43,.14);\n    padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;\n  }\n  .sticky-hint{font-size:13px;color:var(--ink-soft);font-weight:500;}\n  .sticky-error{font-size:13px;color:var(--danger);font-weight:600;}\n  .sticky-actions{display:flex;gap:8px;}\n  .btn-sticky{padding:10px 16px;}\n  @media(max-width:560px){\n    .sticky-inner{flex-direction:column;align-items:stretch;}\n    .sticky-actions{justify-content:stretch;}\n    .sticky-actions .btn{flex:1;justify-content:center;}\n  }\n</style>\n</head>\n<body>\n<div class=\"app\" id=\"app\"></div>\n<div class=\"toast\" id=\"toast\"></div>\n\n<script>\n/* ---------------- state ---------------- */\nlet reports = [];\nlet view = 'form';          // 'form' | 'preview' | 'saved' | 'detail'\nlet editingId = null;\nlet draft = blankReport();\nlet activeDetailId = null;\nlet storageReady = false;\n\nfunction todayISO(){\n  const d = new Date();\n  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');\n}\nconst MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];\nfunction autoReportName(dateStr){\n  if(!dateStr) return '';\n  const [y,m,d] = dateStr.split('-').map(Number);\n  if(!y || !m || !d) return '';\n  const week = Math.ceil(d/7);\n  return `Week-${week} Microbiological Test Report`;\n}\nfunction nextReportNumber(){\n  return 'PUT' + String(reports.length + 1).padStart(2,'0');\n}\nfunction buildFileName(r, ext){\n  const dateForMonth = r.reportDate || todayISO();\n  const [y,m] = dateForMonth.split('-').map(Number);\n  const monthName = MONTH_NAMES[(m||1)-1] || 'Report';\n  const num = r.reportNumber || 'PUT00';\n  return `${monthName}_${num}_Microbiological_Report.${ext}`;\n}\nfunction blankReport(){\n  return {\n    id:null,\n    projectTitle:'CONSTRUCTION OF WORKS & SERVICES FOR OPERATION AND MANAGEMENT OF 24x7 WATER SUPPLY SYSTEM',\n    reportName: autoReportName(todayISO()),\n    reportNameManual:false,\n    reportNumber:null,\n    reportDate:'', sampleDateTime:'', analysisStart:'', analysisEnd:'',\n    sampleQty:'500Ml', testMethod:'H2S Kit Method',\n    samples:[\n      {code:'', name:'RAW Water-Jackwell', tbc:'Absence', ecoli:'Absence'},\n      {code:'', name:'8.7 MLD WTP Treated Water', tbc:'Absence', ecoli:'Absence'},\n      {code:'', name:'6.8 MLD WTP Treated Water', tbc:'Absence', ecoli:'Absence'}\n    ],\n    analysedBy:'', verifiedBy:'',\n    beforeImage:null, afterImage:null, beforeImage2:null, afterImage2:null,\n    createdAt:null, updatedAt:null\n  };\n}\n\n/* ---------------- storage ----------------\n   Uses the host's window.storage API when available (e.g. running inside\n   Claude), and falls back to the browser's own localStorage so this file\n   also works correctly as a standalone page / installed app on a phone. */\nconst STORAGE = {\n  async get(key){\n    if(window.storage && typeof window.storage.get === 'function'){\n      try{\n        const result = await window.storage.get(key, true);\n        if(result) return result;\n      }catch(e){ /* fall through to localStorage */ }\n    }\n    try{\n      const raw = window.localStorage.getItem(key);\n      return raw !== null ? { key, value: raw } : null;\n    }catch(e){\n      console.error('localStorage read failed', e);\n      return null;\n    }\n  },\n  async set(key, value){\n    if(window.storage && typeof window.storage.set === 'function'){\n      try{\n        const result = await window.storage.set(key, value, true);\n        if(result) return result;\n      }catch(e){ /* fall through to localStorage */ }\n    }\n    try{\n      window.localStorage.setItem(key, value);\n      return { key, value };\n    }catch(e){\n      console.error('localStorage write failed', e);\n      return null;\n    }\n  }\n};\n\nasync function loadReports(){\n  try{\n    const res = await STORAGE.get('reports');\n    reports = res && res.value ? JSON.parse(res.value) : [];\n  }catch(e){\n    reports = [];\n  }\n  storageReady = true;\n  render();\n}\nasync function persist(){\n  try{\n    const res = await STORAGE.set('reports', JSON.stringify(reports));\n    if(!res) showToast('Could not save \u2014 storage error');\n  }catch(e){\n    showToast('Could not save \u2014 storage error');\n  }\n}\n// Refresh periodically and whenever the tab regains focus, so multiple tabs/windows\n// on this same device stay in sync without needing a manual reload.\nasync function refreshFromShared(){\n  if(view === 'form' || view === 'preview') return; // don't yank the list out from under someone mid-entry\n  try{\n    const res = await STORAGE.get('reports');\n    const latest = res && res.value ? JSON.parse(res.value) : [];\n    if(JSON.stringify(latest) !== JSON.stringify(reports)){\n      reports = latest;\n      render();\n    }\n  }catch(e){ /* ignore transient errors */ }\n}\nwindow.addEventListener('focus', refreshFromShared);\nsetInterval(refreshFromShared, 15000);\n\n/* ---------------- helpers ---------------- */\nfunction uid(){ return 'RPT-' + Date.now().toString(36).toUpperCase(); }\nfunction esc(s){ return (s||'').toString().replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c])); }\nfunction showToast(msg){\n  const t = document.getElementById('toast');\n  t.textContent = msg;\n  t.classList.add('show');\n  clearTimeout(window.__toastTimer);\n  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);\n}\nfunction fmtDate(d){\n  if(!d) return '\u2014';\n  const parts = d.split('-');\n  if(parts.length===3) return parts[2]+'/'+parts[1]+'/'+parts[0];\n  return d;\n}\nfunction fmtDateTime(dt){\n  if(!dt) return '\u2014';\n  const [datePart, timePart] = dt.split('T');\n  if(!datePart || !timePart) return dt;\n  const [y,m,d] = datePart.split('-');\n  let [hh,mm] = timePart.split(':').map(Number);\n  const ampm = hh>=12 ? 'PM' : 'AM';\n  let h12 = hh%12; if(h12===0) h12=12;\n  return `${d}/${m}/${y} ${String(h12).padStart(2,'0')}:${String(mm).padStart(2,'0')} ${ampm}`;\n}\n\n/* ---------------- icons ---------------- */\nconst ICON = {\n  flask:`<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"white\" stroke-width=\"1.8\"><path d=\"M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-3.5L14 9V3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>`,\n  plus:`<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M12 5v14M5 12h14\" stroke-linecap=\"round\"/></svg>`,\n  trash:`<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14z\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>`,\n  edit:`<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>`,\n  eye:`<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/></svg>`,\n  excel:`<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M4 4h16v16H4z\" stroke-linejoin=\"round\"/><path d=\"M8 8l8 8M16 8l-8 8\" stroke-linecap=\"round\"/></svg>`,\n  pdf:`<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M6 2h9l5 5v15H6z\" stroke-linejoin=\"round\"/><path d=\"M9 13h1.5a1.5 1.5 0 0 0 0-3H9v6M13 16v-6h2M18 13h-2v3h2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>`,\n  mail:`<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M3 5h18v14H3z\" stroke-linejoin=\"round\"/><path d=\"M3 6l9 7 9-7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>`,\n  back:`<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M19 12H5M12 19l-7-7 7-7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>`,\n  check:`<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M20 6L9 17l-5-5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>`,\n  empty:`<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><path d=\"M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-3.5L14 9V3\"/></svg>`\n};\n\n/* ---------------- field bind ---------------- */\nfunction bind(path, value){\n  const keys = path.split('.');\n  let obj = draft;\n  for(let i=0;i<keys.length-1;i++){\n    if(keys[i].includes('[')){\n      const [k,idx] = keys[i].replace(']','').split('[');\n      obj = obj[k][parseInt(idx)];\n    } else obj = obj[keys[i]];\n  }\n  const last = keys[keys.length-1];\n  obj[last] = value;\n}\nwindow.onFieldInput = function(path, el){\n  bind(path, el.value);\n  if(path === 'reportName'){\n    draft.reportNameManual = true;\n  }\n  if(path === 'reportNumber'){\n    draft.reportNumber = el.value.trim() || null;\n  }\n  if(path === 'reportDate' && !draft.reportNameManual){\n    draft.reportName = autoReportName(el.value);\n    render();\n  }\n};\nwindow.onResultModeChange = function(i, field, value){\n  if(value === '__custom__'){\n    draft.samples[i][field] = '';\n  } else {\n    draft.samples[i][field] = value;\n  }\n  render();\n};\nwindow.addSample = function(){\n  draft.samples.push({code:'', name:'', tbc:'Absence', ecoli:'Absence'});\n  render();\n};\nwindow.resetReportName = function(){\n  draft.reportNameManual = false;\n  draft.reportName = autoReportName(draft.reportDate || todayISO());\n  render();\n};\nwindow.resetReportNumber = function(){\n  draft.reportNumber = null;\n  render();\n};\nwindow.removeSample = function(idx){\n  if(draft.samples.length<=1){ showToast('At least one sample row is required'); return; }\n  draft.samples.splice(idx,1);\n  render();\n};\nwindow.onImageUpload = function(which, input){\n  const file = input.files && input.files[0];\n  if(!file) return;\n  if(file.size > 3.5*1024*1024){\n    showToast('Image too large \u2014 please use a file under 3.5MB');\n    input.value = '';\n    return;\n  }\n  const reader = new FileReader();\n  reader.onload = () => {\n    draft[which] = reader.result;\n    render();\n  };\n  reader.onerror = () => showToast('Could not read image');\n  reader.readAsDataURL(file);\n};\nwindow.clearImage = function(which){\n  draft[which] = null;\n  render();\n};\n\n/* ---------------- validation ---------------- */\nfunction pruneBlankExtraSamples(){\n  draft.samples = draft.samples.filter((s,i)=> i===0 || s.code.trim() || s.name.trim() || s.tbc.trim() || s.ecoli.trim());\n  if(draft.samples.length===0) draft.samples.push({code:'', name:'', tbc:'Absence', ecoli:'Absence'});\n}\nfunction validateDraft(){\n  const errs = [];\n  if(!draft.projectTitle.trim()) errs.push('Project title is required.');\n  if(!draft.reportName.trim()) errs.push('Report Name / Subject is required.');\n  if(!draft.reportDate) errs.push('Report date is required.');\n  if(!draft.sampleDateTime) errs.push('Sample date & time is required \u2014 please pick both a date and a time.');\n\n  const first = draft.samples[0];\n  if(!first || !first.code.trim() || !first.name.trim()) errs.push('Sample 1 needs a code and name \u2014 it\\'s required.');\n\n  draft.samples.forEach((s,i)=>{\n    if(i===0) return;\n    const started = s.code.trim() || s.name.trim() || s.tbc.trim() || s.ecoli.trim();\n    if(started && (!s.code.trim() || !s.name.trim())){\n      errs.push('Sample #'+(i+1)+' is optional, but since it\\'s started it needs a code and name too \u2014 or clear it.');\n    }\n  });\n\n  if(!draft.beforeImage) errs.push('Test Kit Picture \u2014 \"Before\" photo is required.');\n  if(!draft.afterImage) errs.push('Test Kit Picture \u2014 \"After\" photo is required.');\n\n  return errs;\n}\n\n/* ---------------- actions ---------------- */\nwindow.goPreview = function(){\n  pruneBlankExtraSamples();\n  const errs = validateDraft();\n  if(errs.length){ window.__errs = errs; render(); return; }\n  window.__errs = [];\n  view = 'preview';\n  render();\n};\nwindow.backToEdit = function(){ view='form'; render(); };\n\nwindow.confirmSave = async function(){\n  // Pull the latest saved list first so we save on top of the most recent data\n  try{\n    const res = await STORAGE.get('reports');\n    if(res && res.value) reports = JSON.parse(res.value);\n  }catch(e){ /* fall back to local copy if this fails */ }\n\n  if(draft.id){\n    draft.updatedAt = new Date().toISOString();\n    const i = reports.findIndex(r=>r.id===draft.id);\n    if(i>-1) reports[i] = JSON.parse(JSON.stringify(draft));\n    else reports.unshift(JSON.parse(JSON.stringify(draft)));\n  } else {\n    draft.id = uid();\n    if(!draft.reportNumber) draft.reportNumber = nextReportNumber();\n    draft.createdAt = new Date().toISOString();\n    draft.updatedAt = draft.createdAt;\n    reports.unshift(JSON.parse(JSON.stringify(draft)));\n  }\n  await persist();\n  activeDetailId = draft.id;\n  editingId = null;\n  view = 'detail';\n  showToast('Report saved');\n  render();\n};\n\nwindow.newEntry = function(){\n  draft = blankReport();\n  editingId = null;\n  window.__errs = [];\n  view = 'form';\n  render();\n};\n\nwindow.editReport = function(id){\n  const r = reports.find(x=>x.id===id);\n  if(!r) return;\n  draft = JSON.parse(JSON.stringify(r));\n  editingId = id;\n  view = 'form';\n  render();\n};\n\nwindow.viewDetail = function(id){\n  activeDetailId = id;\n  view = 'detail';\n  render();\n};\n\nwindow.deleteReport = async function(id){\n  if(!confirm('Delete this report permanently? This cannot be undone.')) return;\n  try{\n    const res = await STORAGE.get('reports');\n    if(res && res.value) reports = JSON.parse(res.value);\n  }catch(e){ /* fall back to local copy if this fails */ }\n  reports = reports.filter(r=>r.id!==id);\n  await persist();\n  showToast('Report deleted');\n  render();\n};\n\nwindow.goSaved = function(){ view='saved'; render(); };\n\n/* ---------------- export: excel ---------------- */\nwindow.exportExcel = function(id){\n  try{\n    const r = reports.find(x=>x.id===id) || draft;\n    const rows = [];\n    rows.push([r.projectTitle]);\n    if(r.reportName) rows.push([r.reportName]);\n    rows.push(['Microbiological Test Report']);\n    rows.push([]);\n    rows.push(['Report No.', r.reportNumber || '\u2014']);\n    rows.push(['Report Date', fmtDate(r.reportDate)]);\n    rows.push(['Sample Date & Time', fmtDateTime(r.sampleDateTime)]);\n    rows.push(['Analysis Start Date', fmtDate(r.analysisStart)]);\n    rows.push(['Analysis End Date', fmtDate(r.analysisEnd)]);\n    rows.push(['Sample Quantity', r.sampleQty]);\n    rows.push(['Test Method', r.testMethod]);\n    rows.push([]);\n    rows.push(['Sample Code','Sample Name','Total Bacterial Count /ml','E-Coli /ml']);\n    r.samples.forEach(s=> rows.push([s.code, s.name, s.tbc || 'Absence', s.ecoli || 'Absence']));\n    rows.push([]);\n    rows.push(['Test Kit Picture \u2014 Before', r.beforeImage ? 'Attached (see PDF export)' : 'Not added']);\n    rows.push(['Test Kit Picture \u2014 After', r.afterImage ? 'Attached (see PDF export)' : 'Not added']);\n    if(r.beforeImage2 || r.afterImage2){\n      rows.push(['Test Kit Picture \u2014 Before (2)', r.beforeImage2 ? 'Attached (see PDF export)' : 'Not added']);\n      rows.push(['Test Kit Picture \u2014 After (2)', r.afterImage2 ? 'Attached (see PDF export)' : 'Not added']);\n    }\n    rows.push([]);\n    rows.push(['Analysed By', r.analysedBy || '']);\n    rows.push(['Verified By', r.verifiedBy || '']);\n    rows.push([]);\n    rows.push(['****** End of the report ******']);\n\n    if(typeof XLSX === 'undefined') throw new Error('Excel library did not load \u2014 check your internet connection and try again.');\n\n    const ws = XLSX.utils.aoa_to_sheet(rows);\n    ws['!cols'] = [{wch:22},{wch:26},{wch:24},{wch:14}];\n    const wb = XLSX.utils.book_new();\n    XLSX.utils.book_append_sheet(wb, ws, 'Report');\n    XLSX.writeFile(wb, buildFileName(r, 'xlsx'));\n    showToast('Excel file downloaded');\n  }catch(e){\n    console.error('Excel export failed:', e);\n    showToast('Excel download failed: ' + (e.message || 'unknown error'));\n  }\n};\n\n/* ---------------- export: pdf ---------------- */\nfunction imgDims(dataUrl){\n  return new Promise(resolve=>{\n    if(!dataUrl){ resolve(null); return; }\n    const img = new Image();\n    img.onload = ()=> resolve({w:img.width, h:img.height});\n    img.onerror = ()=> resolve(null);\n    img.src = dataUrl;\n  });\n}\n\nasync function buildReportPdf(r){\n  const { jsPDF } = window.jspdf;\n  const doc = new jsPDF({unit:'pt', format:'a4'});\n  const pageW = doc.internal.pageSize.getWidth();\n  const pageH = doc.internal.pageSize.getHeight();\n  const marginX = 34;\n  const usableW = pageW - marginX*2;\n  let y = 38;\n\n  // Outer page border \u2014 thicker, flush near the paper edge, no gap\n  doc.setDrawColor(17,17,17); doc.setLineWidth(3.2);\n  doc.rect(16, 16, pageW-32, pageH-32);\n  doc.setLineWidth(1);\n\n  // Title box\n  doc.setFont('helvetica','bold'); doc.setFontSize(12);\n  const titleLines = doc.splitTextToSize(r.projectTitle, usableW-16);\n  doc.text(titleLines, pageW/2, y, {align:'center'});\n  y += titleLines.length*14.5 + 9;\n\n  doc.setFont('helvetica','bold'); doc.setFontSize(15);\n  doc.text('Microbiological Test Report', pageW/2, y, {align:'center'});\n  y += 18;\n\n  // Side-by-side: sample code/name (left) + report meta (right)\n  const leftW = usableW*0.42, rightW = usableW*0.58;\n  doc.autoTable({\n    startY:y, margin:{left:marginX}, tableWidth:leftW,\n    theme:'grid', styles:{fontSize:9.5, cellPadding:5, lineWidth:1.4, lineColor:[17,17,17], fontStyle:'bold'},\n    head:[['Sample Code','Sample Name']],\n    body:r.samples.map(s=>[s.code||'\u2014', s.name||'\u2014']),\n    headStyles:{fillColor:[14,124,134], textColor:255, fontStyle:'bold'}\n  });\n  const leftFinalY = doc.lastAutoTable.finalY;\n\n  doc.autoTable({\n    startY:y, margin:{left:marginX+leftW}, tableWidth:rightW,\n    theme:'grid', styles:{fontSize:9.5, cellPadding:5, lineWidth:1.4, lineColor:[17,17,17], fontStyle:'bold'},\n    body:[\n      ['Report No. :', r.reportNumber || '\u2014'],\n      ['Report Date :', fmtDate(r.reportDate)],\n      ['Sample Date & Time :', fmtDateTime(r.sampleDateTime)],\n      ['Analysis Start Date :', fmtDate(r.analysisStart)],\n      ['Analysis End Date :', fmtDate(r.analysisEnd)],\n    ],\n    columnStyles:{0:{fontStyle:'bold', halign:'right'}, 1:{fontStyle:'bold'}}\n  });\n  y = Math.max(leftFinalY, doc.lastAutoTable.finalY) + 5;\n\n  // Report Name heading (left) + Sample Quantity (right) \u2014 same strip\n  doc.setFillColor(245,248,247);\n  doc.rect(marginX, y, usableW, 24, 'F');\n  doc.setDrawColor(17,17,17); doc.setLineWidth(1); doc.rect(marginX, y, usableW, 24);\n  doc.setFont('helvetica','bold'); doc.setFontSize(11);\n  doc.text(r.reportName || 'Microbiological Test Report', marginX+10, y+16);\n  doc.text('Sample Quantity : ' + r.sampleQty, pageW-marginX-10, y+16, {align:'right'});\n  y += 34;\n\n  // Results table with merged Test Method column\n  const n = r.samples.length;\n  const body = r.samples.map((s,i)=>{\n    const row = [s.code||'\u2014', s.name||'\u2014', s.tbc||'Absence', s.ecoli||'Absence'];\n    if(i===0){ row.push({ content:r.testMethod, rowSpan:n, styles:{valign:'middle'} }); }\n    else { row.push(''); }\n    return row;\n  });\n  doc.autoTable({\n    startY:y, margin:{left:marginX}, tableWidth:usableW,\n    theme:'grid', styles:{fontSize:9.5, cellPadding:6, halign:'center', lineWidth:1, lineColor:[17,17,17], fontStyle:'bold'},\n    head:[['Sample Code','Sample Name','Total Bacterial Count /ml','E-Coli /ml','Test Method']],\n    body:body,\n    headStyles:{fillColor:[14,124,134], textColor:255, fontStyle:'bold'},\n    didParseCell: function(data){\n      if(data.section==='body' && data.column.index===4 && data.row.index!==0){\n        data.cell.text = [];\n      }\n    }\n  });\n  y = doc.lastAutoTable.finalY + 14;\n\n  // Test kit pictures \u2014 full outer box, header inside the box.\n  // Layout adapts to photo orientation: portrait/tall photos sit side-by-side (as in the\n  // source document); landscape/wide photos stack full-width so they use far more of the\n  // page's remaining space instead of leaving a gap before the signatures.\n  const beforeDims = await imgDims(r.beforeImage);\n  const afterDims = await imgDims(r.afterImage);\n  const hasSecondPair = !!(r.beforeImage2 || r.afterImage2);\n\n  if(hasSecondPair){\n    // Two-row layout: Before 1/After 1 on top, Before 2/After 2 below\n    const before2Dims = await imgDims(r.beforeImage2);\n    const after2Dims = await imgDims(r.afterImage2);\n    const reservedForSignOff = 78;\n    const pageBottomLimit = pageH - 24;\n    const boxTop = y;\n\n    doc.setFont('helvetica','bold'); doc.setFontSize(11.5);\n    doc.text('TEST KIT PICTURE', pageW/2, y + 18, {align:'center'});\n    const headingBottomY = y + 24;\n\n    const rowOverhead = 14 + 16 + 12; // gap-to-image + gap-to-caption + row bottom pad\n    const availableTotal = pageBottomLimit - reservedForSignOff - headingBottomY - rowOverhead*2 - 2; // -2 divider\n    const maxHRow = Math.max(80, Math.min(200, availableTotal / 2));\n    const colW = usableW/2 - 16;\n\n    function drawPairRow(topY, beforeImg, beforeD, afterImg, afterD, labelNum){\n      let usedH = 0;\n      const imgTopY = topY + 14;\n      if(beforeImg && beforeD){\n        const ratio = Math.min(colW/beforeD.w, maxHRow/beforeD.h);\n        const w = beforeD.w*ratio, h = beforeD.h*ratio;\n        doc.addImage(beforeImg, marginX + 16 + (colW-w)/2, imgTopY, w, h);\n        usedH = Math.max(usedH, h);\n      }\n      if(afterImg && afterD){\n        const ratio = Math.min(colW/afterD.w, maxHRow/afterD.h);\n        const w = afterD.w*ratio, h = afterD.h*ratio;\n        doc.addImage(afterImg, marginX + usableW/2 + 16 + (colW-w)/2, imgTopY, w, h);\n        usedH = Math.max(usedH, h);\n      }\n      const captionY = imgTopY + usedH + 16;\n      doc.setFontSize(10);\n      doc.text('BEFORE ' + labelNum, marginX + usableW/4, captionY, {align:'center'});\n      doc.text('AFTER ' + labelNum, marginX + usableW*0.75, captionY, {align:'center'});\n      return captionY + 12;\n    }\n\n    const row1BottomY = drawPairRow(headingBottomY, r.beforeImage, beforeDims, r.afterImage, afterDims, '1');\n    const row2BottomY = drawPairRow(row1BottomY, r.beforeImage2, before2Dims, r.afterImage2, after2Dims, '2');\n    const boxBottom = row2BottomY;\n\n    doc.setDrawColor(17,17,17); doc.setLineWidth(1.6);\n    doc.rect(marginX, boxTop, usableW, boxBottom - boxTop);\n    doc.line(marginX, headingBottomY, marginX+usableW, headingBottomY);\n    doc.line(pageW/2, headingBottomY, pageW/2, boxBottom);\n    doc.line(marginX, row1BottomY, marginX+usableW, row1BottomY);\n    doc.setLineWidth(0.6);\n\n    y = boxBottom + 12;\n  } else if(r.beforeImage || r.afterImage){\n  const isLandscape = (d) => d && (d.w / d.h) > 1.15;\n  const useStacked = isLandscape(beforeDims) || isLandscape(afterDims);\n\n    const reservedForSignOff = 78;\n    const pageBottomLimit = pageH - 24;\n    const boxTop = y;\n\n    doc.setFont('helvetica','bold'); doc.setFontSize(11.5);\n    doc.text('TEST KIT PICTURE', pageW/2, y + 18, {align:'center'});\n    const headingBottomY = y + 24;\n\n    if(useStacked){\n      // Full-width stacked layout \u2014 each photo can grow much larger since it isn't\n      // sharing width with its pair.\n      const fullW = usableW - 32;\n      const availableTotal = pageBottomLimit - reservedForSignOff - (headingBottomY + 14) - 2*(14+10) - 14;\n      const maxHEach = Math.max(90, Math.min(280, availableTotal / 2));\n\n      let cursorY = headingBottomY + 14;\n      let h1 = 0;\n      if(r.beforeImage && beforeDims){\n        const ratio = Math.min(fullW/beforeDims.w, maxHEach/beforeDims.h);\n        const w = beforeDims.w*ratio; h1 = beforeDims.h*ratio;\n        doc.addImage(r.beforeImage, marginX + 16 + (fullW-w)/2, cursorY, w, h1);\n      }\n      let caption1Y = cursorY + h1 + 14;\n      doc.setFontSize(10);\n      doc.text('BEFORE', pageW/2, caption1Y, {align:'center'});\n      const dividerY = caption1Y + 10;\n\n      let cursorY2 = dividerY + 14;\n      let h2 = 0;\n      if(r.afterImage && afterDims){\n        const ratio = Math.min(fullW/afterDims.w, maxHEach/afterDims.h);\n        const w = afterDims.w*ratio; h2 = afterDims.h*ratio;\n        doc.addImage(r.afterImage, marginX + 16 + (fullW-w)/2, cursorY2, w, h2);\n      }\n      let caption2Y = cursorY2 + h2 + 14;\n      doc.text('AFTER', pageW/2, caption2Y, {align:'center'});\n      const boxBottom = caption2Y + 12;\n\n      doc.setDrawColor(17,17,17); doc.setLineWidth(1.6);\n      doc.rect(marginX, boxTop, usableW, boxBottom - boxTop);\n      doc.line(marginX, headingBottomY, marginX+usableW, headingBottomY);\n      doc.line(marginX, dividerY, marginX+usableW, dividerY);\n      doc.setLineWidth(0.6);\n\n      y = boxBottom + 12;\n    } else {\n      // Side-by-side layout for portrait/tall photos\n      const availableForImage = pageBottomLimit - reservedForSignOff - y - (22+14+22+10);\n      const maxH = Math.max(110, Math.min(300, availableForImage));\n      const colW = usableW/2 - 16;\n      let usedH = 0;\n      const imgTopY = headingBottomY + 14;\n      if(r.beforeImage && beforeDims){\n        const ratio = Math.min(colW/beforeDims.w, maxH/beforeDims.h);\n        const w = beforeDims.w*ratio, h = beforeDims.h*ratio;\n        doc.addImage(r.beforeImage, marginX + 16 + (colW-w)/2, imgTopY, w, h);\n        usedH = Math.max(usedH, h);\n      }\n      if(r.afterImage && afterDims){\n        const ratio = Math.min(colW/afterDims.w, maxH/afterDims.h);\n        const w = afterDims.w*ratio, h = afterDims.h*ratio;\n        doc.addImage(r.afterImage, marginX + usableW/2 + 16 + (colW-w)/2, imgTopY, w, h);\n        usedH = Math.max(usedH, h);\n      }\n      let captionY = imgTopY + usedH + 16;\n      doc.setFontSize(10);\n      doc.text('BEFORE', marginX + usableW/4, captionY, {align:'center'});\n      doc.text('AFTER', marginX + usableW*0.75, captionY, {align:'center'});\n      const boxBottom = captionY + 12;\n\n      doc.setDrawColor(17,17,17); doc.setLineWidth(1.6);\n      doc.rect(marginX, boxTop, usableW, boxBottom - boxTop);\n      doc.line(marginX, headingBottomY, marginX+usableW, headingBottomY);\n      doc.line(pageW/2, headingBottomY, pageW/2, boxBottom);\n      doc.setLineWidth(0.6);\n\n      y = boxBottom + 12;\n    }\n  }\n\n  // Sign-off + end-of-report. If content already reaches close to the bottom, pin the\n  // sign-off flush near the page edge so the sheet reads as fully used. If content is\n  // still far short of the page (rare, after the sizing above), don't force an artificial\n  // jump \u2014 keep the sign-off close to the content instead, so any leftover space sits as\n  // ordinary margin at the true bottom of the page rather than a gap in the middle.\n  const bottomBlockY = pageH - 62;\n  const gapToBottom = bottomBlockY - y;\n  if(gapToBottom >= 0 && gapToBottom <= 170){\n    y = bottomBlockY;\n  } else if(gapToBottom < 0){\n    y = pageH - 40;\n  } else {\n    y += 40;\n  }\n\n  doc.setFont('helvetica','bold'); doc.setFontSize(11);\n  doc.text(r.analysedBy || 'Analysed By', marginX+105, y, {align:'center'});\n  doc.text(r.verifiedBy || 'Verified By', pageW-marginX-105, y, {align:'center'});\n  y += 20;\n\n  doc.setFont('helvetica','bold'); doc.setFontSize(9);\n  doc.text('****** End of the report ******', pageW/2, y, {align:'center'});\n\n  return doc;\n}\n\nwindow.exportPdf = async function(id){\n  try{\n    if(typeof window.jspdf === 'undefined') throw new Error('PDF library did not load \u2014 check your internet connection and try again.');\n    const r = reports.find(x=>x.id===id) || draft;\n    const doc = await buildReportPdf(r);\n    doc.save(buildFileName(r, 'pdf'));\n    showToast('PDF file downloaded');\n  }catch(e){\n    console.error('PDF export failed:', e);\n    showToast('PDF download failed: ' + (e.message || 'unknown error'));\n  }\n};\n\n/* ---------------- export: email ---------------- */\nconst EMAIL_RECIPIENTS = [\n  {id:'r1', label:'Mohamed Azarudeen', email:'mohamed.azarudeen@suez.com'},\n  {id:'r2', label:'ASI D2K', email:'asi.d2k@gmail.com'}\n];\nlet emailChecks = {r1:true, r2:true};\nwindow.toggleEmailCheck = function(id){\n  emailChecks[id] = !emailChecks[id];\n  render();\n};\nfunction sampleDateOnly(dt){\n  if(!dt) return '';\n  return dt.split('T')[0];\n}\nfunction reportEmailSubject(r){\n  const dateStr = fmtDate(sampleDateOnly(r.sampleDateTime) || r.reportDate);\n  return dateStr + ' Microbiological Test Report';\n}\n\nwindow.sendReportEmail = async function(id){\n  const selected = EMAIL_RECIPIENTS.filter(r=>emailChecks[r.id]).map(r=>r.email);\n  if(selected.length===0){ showToast('Select at least one recipient'); return; }\n  const r = reports.find(x=>x.id===id) || draft;\n  const subject = reportEmailSubject(r);\n  const fileName = buildFileName(r, 'pdf');\n\n  let doc, pdfBlob;\n  try{\n    showToast('Preparing PDF\u2026');\n    doc = await buildReportPdf(r);\n    pdfBlob = doc.output('blob');\n  }catch(e){\n    console.error('Building PDF for email failed:', e);\n    showToast('Could not prepare the PDF: ' + (e.message || 'unknown error'));\n    return;\n  }\n\n  // Best available path: share the actual PDF file straight into the device's Mail app (true one-click attach)\n  try{\n    const file = new File([pdfBlob], fileName, {type:'application/pdf'});\n    if(navigator.canShare && navigator.canShare({files:[file]})){\n      await navigator.share({\n        files:[file],\n        title:subject,\n        text:'Report PDF attached. Intended recipient(s): ' + selected.join(', ')\n      });\n      showToast('Share sheet opened \u2014 pick Mail to send with the PDF attached');\n      return;\n    }\n  }catch(e){\n    if(e && e.name === 'AbortError') return; // user cancelled the share sheet\n  }\n\n  // Fallback (most desktop browsers): browsers cannot silently attach a file to an email.\n  // Auto-download the PDF, then open a pre-addressed mail draft so the person only has to attach + hit send.\n  try{\n    doc.save(fileName);\n    const body = 'The report PDF (' + fileName + ') has just downloaded to your device \u2014 please attach it to this email before sending.\\n\\n(Your browser does not allow websites to attach files to emails automatically; this is the closest one-click flow it allows.)';\n    window.location.href = 'mailto:' + encodeURIComponent(selected.join(',')) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);\n    showToast('PDF downloaded \u2014 attach it in the email draft that just opened');\n  }catch(e){\n    console.error('PDF download fallback failed:', e);\n    showToast('Download failed: ' + (e.message || 'unknown error'));\n  }\n};\n\nfunction renderStickyBar(){\n  if(!storageReady) return '';\n  if(view==='form'){\n    const errs = window.__errs || [];\n    return `\n      <div class=\"sticky-inner\">\n        ${errs.length ? `<span class=\"sticky-error\">${errs.length} field${errs.length>1?'s':''} need attention \u2191</span>` : `<span class=\"sticky-hint\">Fill in the report, then preview the draft.</span>`}\n        <button class=\"btn btn-primary btn-sticky\" onclick=\"goPreview()\">${ICON.eye} Preview Draft</button>\n      </div>`;\n  }\n  if(view==='preview'){\n    return `\n      <div class=\"sticky-inner\">\n        <span class=\"sticky-hint\">Draft \u2014 not yet saved.</span>\n        <div class=\"sticky-actions\">\n          <button class=\"btn btn-ghost btn-sticky\" onclick=\"backToEdit()\">${ICON.back} Edit</button>\n          <button class=\"btn btn-primary btn-sticky\" onclick=\"confirmSave()\">${ICON.check} Confirm &amp; Save</button>\n        </div>\n      </div>`;\n  }\n  if(view==='detail'){\n    const r = reports.find(x=>x.id===activeDetailId);\n    if(!r) return '';\n    return `\n      <div class=\"sticky-inner\">\n        <span class=\"sticky-hint\">Saved report \u2014 download or share below.</span>\n        <div class=\"sticky-actions\">\n          <button class=\"btn btn-success btn-sticky\" onclick=\"exportExcel('${r.id}')\">${ICON.excel} Excel</button>\n          <button class=\"btn btn-outline-danger btn-sticky\" onclick=\"exportPdf('${r.id}')\">${ICON.pdf} PDF</button>\n        </div>\n      </div>`;\n  }\n  return '';\n}\n\n/* ---------------- render ---------------- */\nfunction render(){\n  const app = document.getElementById('app');\n  app.innerHTML = `\n    <div class=\"topbar\">\n      <div class=\"brand\">\n        <div class=\"brand-mark\">${ICON.flask}</div>\n        <div>\n          <h1>Water Quality Lab Reports</h1>\n          <p>Microbiological test report entry system</p>\n        </div>\n      </div>\n      <div class=\"tabs\">\n        <button class=\"tab-btn ${view==='form'||view==='preview'?'active':''}\" onclick=\"newEntry()\">New Entry</button>\n        <button class=\"tab-btn ${view==='saved'||view==='detail'?'active':''}\" onclick=\"goSaved()\">Saved Reports<span class=\"badge-count\">${reports.length}</span></button>\n      </div>\n    </div>\n    <div id=\"content\"></div>\n    <div id=\"sticky-bar\"></div>\n  `;\n  const content = document.getElementById('content');\n  if(!storageReady){ content.innerHTML = `<div class=\"empty-state\">Loading\u2026</div>`; return; }\n  if(view==='form') content.innerHTML = renderForm();\n  else if(view==='preview') content.innerHTML = renderPreview(draft, false);\n  else if(view==='detail') content.innerHTML = renderDetail();\n  else content.innerHTML = renderSavedList();\n\n  document.getElementById('sticky-bar').innerHTML = renderStickyBar();\n\n  if(view==='form'){\n    document.querySelectorAll('[data-path]').forEach(el=>{\n      el.addEventListener('input', ()=> onFieldInput(el.getAttribute('data-path'), el));\n      el.addEventListener('change', ()=> onFieldInput(el.getAttribute('data-path'), el));\n    });\n  }\n}\n\nfunction renderImageField(key, label, required){\n  const val = draft[key];\n  return `\n    <div class=\"field\">\n      <label>${esc(label)} ${required ? '<span class=\"req\">*</span>' : '<span class=\"tag-opt\">optional</span>'}</label>\n      ${val\n        ? `<div class=\"img-preview\"><img src=\"${val}\"><button class=\"icon-btn img-remove\" onclick=\"clearImage('${key}')\" title=\"Remove\">${ICON.trash}</button></div>`\n        : `<label class=\"dropzone\">\n             <input type=\"file\" accept=\"image/*\" onchange=\"onImageUpload('${key}', this)\">\n             ${ICON.plus}\n             <span>Click to upload \"${esc(label)}\" photo</span>\n           </label>`}\n    </div>\n  `;\n}\nfunction renderForm(){\n  const errs = window.__errs || [];\n  const s = draft.samples.map((sample, i)=>`\n    <div class=\"sample-row\">\n      <div class=\"row-head\">\n        <span>SAMPLE ${i+1} ${i===0 ? '<em class=\"tag-req\">required</em>' : '<em class=\"tag-opt\">optional</em>'}</span>\n        ${i>0 ? `<button class=\"icon-btn\" onclick=\"removeSample(${i})\" title=\"Remove sample\">${ICON.trash}</button>` : ''}\n      </div>\n      <div class=\"sample-grid\">\n        <div class=\"field\"><label>Sample Code</label><input data-path=\"samples[${i}].code\" value=\"${esc(sample.code)}\" placeholder=\"M13\"></div>\n        <div class=\"field\"><label>Sample Name</label><input list=\"sample-name-options\" data-path=\"samples[${i}].name\" value=\"${esc(sample.name)}\" placeholder=\"RAW Water-Jackwell\"></div>\n        <div class=\"field\">\n          <label>Total Bacterial Count /ml</label>\n          <select onchange=\"onResultModeChange(${i},'tbc',this.value)\">\n            <option value=\"Absence\" ${sample.tbc==='Absence'?'selected':''}>Absence</option>\n            <option value=\"Presence\" ${sample.tbc==='Presence'?'selected':''}>Presence</option>\n            <option value=\"__custom__\" ${(sample.tbc!=='Absence'&&sample.tbc!=='Presence')?'selected':''}>Type a value\u2026</option>\n          </select>\n          ${(sample.tbc!=='Absence'&&sample.tbc!=='Presence') ? `<input style=\"margin-top:8px;\" data-path=\"samples[${i}].tbc\" value=\"${esc(sample.tbc)}\" placeholder=\"e.g. 100\">` : ''}\n        </div>\n        <div class=\"field\">\n          <label>E-Coli /ml</label>\n          <select onchange=\"onResultModeChange(${i},'ecoli',this.value)\">\n            <option value=\"Absence\" ${sample.ecoli==='Absence'?'selected':''}>Absence</option>\n            <option value=\"Presence\" ${sample.ecoli==='Presence'?'selected':''}>Presence</option>\n            <option value=\"__custom__\" ${(sample.ecoli!=='Absence'&&sample.ecoli!=='Presence')?'selected':''}>Type a value\u2026</option>\n          </select>\n          ${(sample.ecoli!=='Absence'&&sample.ecoli!=='Presence') ? `<input style=\"margin-top:8px;\" data-path=\"samples[${i}].ecoli\" value=\"${esc(sample.ecoli)}\" placeholder=\"e.g. 10\">` : ''}\n        </div>\n      </div>\n    </div>\n  `).join('');\n\n  return `\n    <datalist id=\"sample-name-options\">\n      <option value=\"RAW Water-Jackwell\">\n      <option value=\"8.7 MLD WTP Treated Water\">\n      <option value=\"6.8 MLD WTP Treated Water\">\n    </datalist>\n    <div class=\"card\">\n      <h2><span class=\"num\">01</span> Project &amp; Report Details</h2>\n      <div class=\"grid\">\n        <div class=\"field full\">\n          <label>Project Title</label>\n          <textarea data-path=\"projectTitle\">${esc(draft.projectTitle)}</textarea>\n        </div>\n        <div class=\"field full\">\n          <label>Report Name / Subject <span class=\"req\">*</span> ${draft.reportNameManual ? '' : '<span class=\"tag-opt\">auto</span>'}</label>\n          <div class=\"input-with-btn\">\n            <input data-path=\"reportName\" value=\"${esc(draft.reportName)}\" placeholder=\"e.g. Week-2 Microbiological Test Report\">\n            ${draft.reportNameManual ? `<button type=\"button\" class=\"mini-reset-btn\" onclick=\"resetReportName()\" title=\"Reset to auto (Month + Week + Microbiological Test Report)\">Reset</button>` : ''}\n          </div>\n        </div>\n        <div class=\"field\">\n          <label>Report Number ${draft.reportNumber ? '' : '<span class=\"tag-opt\">auto</span>'}</label>\n          <div class=\"input-with-btn\">\n            <input data-path=\"reportNumber\" value=\"${esc(draft.reportNumber || nextReportNumber())}\">\n            ${draft.reportNumber ? `<button type=\"button\" class=\"mini-reset-btn\" onclick=\"resetReportNumber()\" title=\"Reset to auto numbering\">Reset</button>` : ''}\n          </div>\n        </div>\n        <div class=\"field\"><label>Report Date</label><input type=\"date\" data-path=\"reportDate\" value=\"${esc(draft.reportDate)}\"></div>\n        <div class=\"field\"><label>Sample Date &amp; Time <span class=\"req\">*</span></label><input type=\"datetime-local\" data-path=\"sampleDateTime\" value=\"${esc(draft.sampleDateTime)}\"></div>\n        <div class=\"field\"><label>Analysis Start Date</label><input type=\"date\" data-path=\"analysisStart\" value=\"${esc(draft.analysisStart)}\"></div>\n        <div class=\"field\"><label>Analysis End Date</label><input type=\"date\" data-path=\"analysisEnd\" value=\"${esc(draft.analysisEnd)}\"></div>\n        <div class=\"field\">\n          <label>Sample Quantity</label>\n          <select data-path=\"sampleQty\">\n            <option value=\"500Ml\" ${draft.sampleQty==='500Ml'?'selected':''}>500Ml</option>\n            <option value=\"1 Litre\" ${draft.sampleQty==='1 Litre'?'selected':''}>1 Litre</option>\n          </select>\n        </div>\n        <div class=\"field\">\n          <label>Test Method</label>\n          <select data-path=\"testMethod\">\n            <option value=\"H2S Kit Method\" ${draft.testMethod==='H2S Kit Method'?'selected':''}>H2S Kit Method (Default)</option>\n            <option value=\"Bactaslyde-E.Coli+TBC Test Kit\" ${draft.testMethod==='Bactaslyde-E.Coli+TBC Test Kit'?'selected':''}>Bactaslyde-E.Coli+TBC Test Kit</option>\n          </select>\n        </div>\n      </div>\n    </div>\n\n    <div class=\"card\">\n      <div class=\"sample-head-row\">\n        <h2 style=\"margin:0;\"><span class=\"num\">02</span> Sample Results</h2>\n        <button class=\"add-row-icon-btn\" onclick=\"addSample()\" title=\"Add another sample\">${ICON.plus} <span>Add Sample</span></button>\n      </div>\n      ${s}\n      <div class=\"helper\">Sample 1 is required. Extra samples are optional.</div>\n    </div>\n\n    <div class=\"card\">\n      <h2><span class=\"num\">03</span> Test Kit Picture</h2>\n      <div class=\"grid\">\n        ${renderImageField('beforeImage', 'Before', true)}\n        ${renderImageField('afterImage', 'After', true)}\n        ${draft.testMethod === 'Bactaslyde-E.Coli+TBC Test Kit' ? `\n          ${renderImageField('beforeImage2', 'Before (2nd photo)', false)}\n          ${renderImageField('afterImage2', 'After (2nd photo)', false)}\n        ` : ''}\n      </div>\n      <div class=\"helper\">${draft.testMethod === 'Bactaslyde-E.Coli+TBC Test Kit'\n        ? 'Bactaslyde-E.Coli+TBC Test Kit supports a 2nd Before/After photo \u2014 the first of each is required, the second is optional.'\n        : 'Both Before and After test kit photos are required \u2014 matches the \"Test Kit Picture\" section in the source report.'}</div>\n    </div>\n\n    <div class=\"card\">\n      <h2><span class=\"num\">04</span> Sign-off</h2>\n      <div class=\"grid\">\n        <div class=\"field\"><label>Analysed By</label><input data-path=\"analysedBy\" value=\"${esc(draft.analysedBy)}\" placeholder=\"Name\"></div>\n        <div class=\"field\"><label>Verified By</label><input data-path=\"verifiedBy\" value=\"${esc(draft.verifiedBy)}\" placeholder=\"Name\"></div>\n      </div>\n      ${errs.length ? `<div class=\"error-text\">${errs.map(e=>'\u2022 '+esc(e)).join('<br>')}</div>` : ''}\n      <div class=\"btn-row\" style=\"margin-top:18px;\">\n        <button class=\"btn btn-primary\" onclick=\"goPreview()\">${ICON.eye} Preview Draft</button>\n        ${editingId ? `<button class=\"btn btn-ghost\" onclick=\"newEntry()\">${ICON.back} Cancel edit</button>` : ''}\n      </div>\n    </div>\n  `;\n}\n\nfunction buildKitRowsHTML(r){\n  const pairs = [{before:r.beforeImage, after:r.afterImage, n:1}];\n  if(r.beforeImage2 || r.afterImage2){\n    pairs.push({before:r.beforeImage2, after:r.afterImage2, n:2});\n  }\n  const multi = pairs.length > 1;\n  return pairs.map((p, idx) => `\n    ${idx>0 ? '<div style=\"border-top:2px solid #111;\"></div>' : ''}\n    <div class=\"doc-kit-row\">\n      <div class=\"doc-kit-cell\">\n        ${p.before ? `<img src=\"${p.before}\">` : `<div class=\"doc-kit-empty\">No \"Before\"${multi?' ('+p.n+')':''} image added</div>`}\n        <div class=\"cap\">BEFORE${multi ? ' '+p.n : ''}</div>\n      </div>\n      <div class=\"doc-kit-cell\">\n        ${p.after ? `<img src=\"${p.after}\">` : `<div class=\"doc-kit-empty\">No \"After\"${multi?' ('+p.n+')':''} image added</div>`}\n        <div class=\"cap\">AFTER${multi ? ' '+p.n : ''}</div>\n      </div>\n    </div>\n  `).join('');\n}\nfunction renderPreview(r, saved){\n  const n = r.samples.length;\n  return `\n    <div class=\"card preview-wrap\">\n      <div class=\"doc-sheet\">\n        <div class=\"stamp ${saved?'saved':''}\">${saved?'Saved \u2713':'Draft \u2014 not yet saved'}</div>\n        <div class=\"doc-title-box\">\n          <h3>${esc(r.projectTitle)}</h3>\n        </div>\n        <div class=\"doc-sub\">Microbiological Test Report</div>\n\n        <div class=\"doc-meta-row\">\n          <div class=\"doc-meta-left\">\n            <table>\n              <tr><th>Sample Code</th><th>Sample Name</th></tr>\n              ${r.samples.map(s=>`<tr><td class=\"mono\">${esc(s.code)||'\u2014'}</td><td>${esc(s.name)||'\u2014'}</td></tr>`).join('')}\n            </table>\n          </div>\n          <div class=\"doc-meta-right\">\n            <table>\n              <tr><td class=\"k\">Report No. :</td><td class=\"v\">${esc(r.reportNumber)||'\u2014'}</td></tr>\n              <tr><td class=\"k\">Report Date :</td><td class=\"v\">${fmtDate(r.reportDate)}</td></tr>\n              <tr><td class=\"k\">Sample Date &amp; Time :</td><td class=\"v\">${fmtDateTime(r.sampleDateTime)}</td></tr>\n              <tr><td class=\"k\">Analysis Start Date :</td><td class=\"v\">${fmtDate(r.analysisStart)}</td></tr>\n              <tr><td class=\"k\">Analysis End Date :</td><td class=\"v\">${fmtDate(r.analysisEnd)}</td></tr>\n            </table>\n          </div>\n        </div>\n\n        <div class=\"doc-qty-row\">\n          <span class=\"doc-report-name\">${esc(r.reportName) || 'Microbiological Test Report'}</span>\n          <span class=\"doc-qty-value\">Sample Quantity : ${esc(r.sampleQty)}</span>\n        </div>\n\n        <table class=\"doc-results\">\n          <thead>\n            <tr>\n              <th rowspan=\"2\">Sample Code</th>\n              <th rowspan=\"2\">Sample Name</th>\n              <th colspan=\"2\">Result</th>\n              <th rowspan=\"2\">Test Method</th>\n            </tr>\n            <tr>\n              <th>Total Bacterial Count /ml</th>\n              <th>E-Coli /ml</th>\n            </tr>\n          </thead>\n          <tbody>\n            ${r.samples.map((s,i)=>`\n              <tr>\n                <td class=\"mono\">${esc(s.code)||'\u2014'}</td>\n                <td class=\"name-cell\">${esc(s.name)||'\u2014'}</td>\n                <td>${esc(s.tbc || 'Absence')}</td>\n                <td>${esc(s.ecoli || 'Absence')}</td>\n                ${i===0 ? `<td rowspan=\"${n}\">${esc(r.testMethod)}</td>` : ''}\n              </tr>`).join('')}\n          </tbody>\n        </table>\n\n        <div class=\"doc-spacer\"></div>\n\n        <div class=\"doc-kit-box\">\n          <div class=\"doc-kit-heading\">Test Kit Picture</div>\n          ${buildKitRowsHTML(r)}\n        </div>\n\n        <div class=\"doc-signoff\">\n          <div>${esc(r.analysedBy)||'Analysed By'}</div>\n          <div>${esc(r.verifiedBy)||'Verified By'}</div>\n        </div>\n        <div class=\"doc-end\">****** End of the report ******</div>\n      </div>\n    </div>\n    ${!saved ? `\n    <div class=\"card\">\n      <div class=\"helper\">Review the draft above. Confirming will save this report to your saved list, after which you can download it as Excel or PDF, or draft an email.</div>\n      <div class=\"btn-row\" style=\"margin-top:12px;\">\n        <button class=\"btn btn-primary\" onclick=\"confirmSave()\">${ICON.check} Confirm & Save</button>\n        <button class=\"btn btn-ghost\" onclick=\"backToEdit()\">${ICON.back} Back to edit</button>\n      </div>\n    </div>` : ''}\n  `;\n}\n\nfunction renderDetail(){\n  const r = reports.find(x=>x.id===activeDetailId);\n  if(!r) return `<div class=\"empty-state\">Report not found.</div>`;\n  return `\n    ${renderPreview(r, true)}\n    <div class=\"card\">\n      <h2><span class=\"num\">\u2193</span> Download & Share</h2>\n      <div class=\"export-panel\">\n        <button class=\"btn btn-success\" onclick=\"exportExcel('${r.id}')\">${ICON.excel} Download Excel</button>\n        <button class=\"btn btn-outline-danger\" onclick=\"exportPdf('${r.id}')\">${ICON.pdf} Download PDF</button>\n      </div>\n\n      <div class=\"email-block\">\n        <label class=\"email-block-label\">Email recipients</label>\n        <div class=\"email-checks\">\n          ${EMAIL_RECIPIENTS.map(rec=>`\n            <label class=\"email-check\">\n              <input type=\"checkbox\" ${emailChecks[rec.id]?'checked':''} onchange=\"toggleEmailCheck('${rec.id}')\">\n              <span>${esc(rec.label)}<em>${esc(rec.email)}</em></span>\n            </label>\n          `).join('')}\n        </div>\n        <button class=\"btn btn-ghost\" onclick=\"sendReportEmail('${r.id}')\">${ICON.mail} Send Report by Email</button>\n        <div class=\"helper\">On phones/tablets that support file sharing, this opens your share sheet with the actual report PDF attached \u2014 pick Mail and send. On desktop browsers (which can't auto-attach files to email), it downloads the PDF and opens a pre-addressed draft for you to attach it to.</div>\n      </div>\n\n      <div class=\"btn-row\" style=\"margin-top:16px;\">\n        <button class=\"btn btn-ghost\" onclick=\"editReport('${r.id}')\">${ICON.edit} Edit this report</button>\n        <button class=\"btn btn-ghost\" onclick=\"goSaved()\">${ICON.back} Back to saved reports</button>\n      </div>\n    </div>\n  `;\n}\n\nfunction renderSavedList(){\n  if(!reports.length){\n    return `<div class=\"card\"><div class=\"empty-state\">${ICON.empty}<div>No reports saved yet.</div><div style=\"margin-top:14px;\"><button class=\"btn btn-primary\" onclick=\"newEntry()\">${ICON.plus} Create your first report</button></div></div></div>`;\n  }\n  return `\n    <div class=\"card\">\n      <h2><span class=\"num\">${reports.length}</span> Saved Reports</h2>\n      <div class=\"list-table-wrap\">\n      <table class=\"list-table\">\n        <thead><tr><th>Report No.</th><th>Report Name / Subject</th><th>Project</th><th>Report Date</th><th>Samples</th><th>Analysed By</th><th></th></tr></thead>\n        <tbody>\n          ${reports.map(r=>`\n            <tr>\n              <td><span class=\"pill\">${esc(r.reportNumber)||'\u2014'}</span></td>\n              <td>${r.reportName ? esc(r.reportName) : '<span style=\"color:var(--ink-soft);font-style:italic;\">Untitled</span>'}</td>\n              <td>${esc(r.projectTitle).slice(0,40)}${r.projectTitle.length>40?'\u2026':''}</td>\n              <td>${fmtDate(r.reportDate)}</td>\n              <td>${r.samples.length}</td>\n              <td>${esc(r.analysedBy)||'\u2014'}</td>\n              <td>\n                <div class=\"row-actions\">\n                  <button title=\"View / Download\" onclick=\"viewDetail('${r.id}')\">${ICON.eye}</button>\n                  <button title=\"Edit\" onclick=\"editReport('${r.id}')\">${ICON.edit}</button>\n                  <button class=\"del\" title=\"Delete\" onclick=\"deleteReport('${r.id}')\">${ICON.trash}</button>\n                </div>\n              </td>\n            </tr>\n          `).join('')}\n        </tbody>\n      </table>\n      </div>\n    </div>\n  `;\n}\n\nloadReports();\n<\/script>\n</body>\n</html>\n";
  var CENTRI_HTML = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Centrifuge Unit \u2014 Operator SOP</title>\n<style>\n  :root{\n    color-scheme: light only;\n    --bg: #F5F4F0;\n    --panel: #FFFFFF;\n    --panel-2: #EEEDE7;\n    --line: #D8D6CE;\n    --text: #22262A;\n    --text-dim: #5B6067;\n    --text-faint: #8B9096;\n    --amber: #E0870B;\n    --amber-dim: #FEF0D9;\n    --amber-2: #F5A524;\n    --green: #12875A;\n    --green-dim: #DFF7EA;\n    --green-2: #22C57E;\n    --red: #DC3B2E;\n    --red-dim: #FDE6E3;\n    --red-2: #F0574A;\n    --steel: #2160C4;\n    --steel-dim: #E3EDFC;\n    --steel-2: #4C86F0;\n    --purple: #8148D6;\n    --purple-dim: #F0E9FC;\n    --teal: #0E9F8E;\n    --teal-dim: #DDF7F3;\n    --mono: 'SF Mono', 'Cascadia Mono', Consolas, monospace;\n    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\n  }\n  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}\n  html{ background:var(--bg); overflow-x:hidden; }\n  body{\n    margin:0; background:var(--bg); color:var(--text);\n    font-family:var(--sans); padding:0 0 60px; overflow-x:hidden;\n  }\n  .wrap{ max-width:760px; margin:0 auto; padding:20px 16px; }\n  @media (max-width: 480px){\n    .wrap{ padding:14px 12px; }\n  }\n\n  header{\n    display:flex; justify-content:space-between; align-items:flex-start;\n    border-bottom:2px solid var(--line); padding-bottom:18px; margin-bottom:22px;\n    gap:16px; flex-wrap:wrap; position:relative;\n  }\n  header::before{\n    content:''; position:absolute; left:0; right:0; bottom:-2px; height:3px;\n    background:linear-gradient(90deg, var(--amber), var(--teal), var(--steel), var(--purple));\n    border-radius:3px;\n  }\n  .htitle{ flex:1; min-width:220px; }\n  .eyebrow{\n    font-size:12px; letter-spacing:0.04em; color:var(--steel); margin:0 0 4px;\n    display:flex; align-items:center; gap:6px; font-w
